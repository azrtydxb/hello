<<VOIP CONFIG FILE>>Version:2.0002

<SIP CONFIG MODULE>
--SIP Line List--  :
SIP1 Phone Number  :{{.Line.Username}}
SIP1 Display Name  :{{.Line.DisplayName}}
SIP1 Sip Name      :{{.Line.AccountLabel}}
SIP1 Register Addr :{{.Server.Host}}
SIP1 Register Port :{{.Server.Port}}
SIP1 Register User :{{.Line.AuthName}}
SIP1 Register Pswd :{{.Line.Password}}
SIP1 Register TTL  :{{.Server.Expiry}}
SIP1 Enable Reg    :1
SIP1 Transport     :0
{{- /* Text messages (SIP MESSAGE, RFC 3428): Fanvil documents no key to switch instant messages on that we could cite, so none is written; the phone shows a MESSAGE it receives as it does by default. Unverified on hardware (lab item). */}}
{{- /* HD voice: the line's codec map in order of preference, Opus (models that have it), G.722, G.711 u-law, G.711 A-law (Fanvil auto-provisioning, "Voice Codec Map" of a SIP line; the VoiceCodecMap element of the XML form of the same file). Another line of a multi-line model takes SIP2, SIP3 and so on. Unverified on hardware (verify). */}}
SIP1 Voice Codec Map :{{if .Codecs.Opus}}opus,{{end}}G722,G711U,G711A
{{- /* MWI: SIP1 Subscribe is the line's "Subscribe For Voice Message" (Fanvil XU series manual, Line >> SIP >> Basic Settings: "Enable the device to subscribe a voice message waiting notification", with its "Voice Message Number" and "Voice Message Subscribe Period"); the keys are SIP1 Subscribe, SIP1 MWI Num and SIP1 Sub Expire in a Fanvil configuration export. */}}
SIP1 Subscribe     :1
SIP1 Sub Expire    :3600
SIP1 MWI Num       :{{or .Line.VoicemailCode "*97"}}
{{- /* Directed pickup: the line's PickUp Number (manual: "Set the scramble number when the Pickup is enabled"; export key SIP1 Pickup Num). */}}
{{- with .Codes.PickupDirected}}
SIP1 Pickup Num    :{{.}}
{{- end}}
{{- /* Star codes: "Use Feature Code" (SIP1 SvcCode Mode) makes the phone's DND and call-forward keys dial the PBX's codes instead of acting alone (manual, Line >> SIP >> System; keys as in the export). A forward code is dialled followed by the target. Left off when the PBX defines none. */}}
{{- if or .Codes.DNDOn .Codes.ForwardOn .Codes.ForwardBusyOn .Codes.ForwardNoAnswerOn}}
SIP1 SvcCode Mode  :1
SIP1 DNDOn SvcCode :{{.Codes.DNDOn}}
SIP1 DNDOff SvcCode :{{.Codes.DNDOff}}
SIP1 CFUOn SvcCode :{{.Codes.ForwardOn}}
SIP1 CFUOff SvcCode :{{.Codes.ForwardOff}}
SIP1 CFBOn SvcCode :{{.Codes.ForwardBusyOn}}
SIP1 CFBOff SvcCode :{{.Codes.ForwardBusyOff}}
SIP1 CFNOn SvcCode :{{.Codes.ForwardNoAnswerOn}}
SIP1 CFNOff SvcCode :{{.Codes.ForwardNoAnswerOff}}
{{- end}}
{{- /* Call recording: the phone's Record key sends SIP INFO with these bodies, which the PBX turns into the *1 recording toggle (export keys SIP1 Record Start and SIP1 Record Stop, defaults Record:on and Record:off). */}}
SIP1 Record Start  :Record:on
SIP1 Record Stop   :Record:off
{{- /* Feature Key Synchronization (spec S-7): "SIP1 Feature Sync" sits with the other BroadSoft line options (Sub CallPark, Sub CC Status) in Fanvil X-series configuration files (the key name is from a sample X-series export; Fanvil documents no help text we could cite, so that it is the as-feature-event switch is unverified). Unverified on hardware (verify). */}}
SIP1 Feature Sync  :1

<CALL FEATURE MODULE>
--Port Config--    :
{{- /* Paging and intercom (phonebooks-ptt P-12, P-13): accept the PBX's Alert-Info auto-answer calls, with the intercom tone, not muted and no barge into a call. Manual, Features >> Intercom: Enable Intercom (accept an incoming call with an Alert-Info header and answer it by itself after a delay), Mute, Tone and Barge; the keys are P1 Enable Intercom, P1 Intercom Mute, P1 Intercom Tone and P1 Intercom Barge in the export. The line's own SIP1 Auto Answer would answer every call and stays off. */}}
P1 Enable Intercom :1
P1 Intercom Mute   :0
P1 Intercom Tone   :1
P1 Intercom Barge  :0
{{- /* Call waiting (phone-feature-parity S-18): P1 CallWaiting and P1 CWaiting Tone are the line 1 keys of the Fanvil X-series exported configuration (<CALL FEATURE MODULE>); the tone follows the switch. Unverified on a phone (verify, lab item 26). */}}
P1 CallWaiting     :{{if .Line.CallWaiting}}1{{else}}0{{end}}
P1 CWaiting Tone   :{{if .Line.CallWaiting}}1{{else}}0{{end}}

<PHONE FEATURE MODULE>
Enable SNTP        :1
SNTP Server        :{{.Time.NTP}}
{{- with .Time.TZ}}
{{- if .Known}}
Time Zone          :{{.FanvilOffset}}
Time Zone Name     :{{.FanvilName}}
{{- if .DST}}
DST Type           :1
DST Rule Mode      :0
DST Min Offset     :{{.SaveMinutes}}
DST Start Mon      :{{.FanvilStart.Month}}
DST Start Week     :{{.FanvilStart.Week}}
DST Start Wday     :{{.FanvilStart.Weekday}}
DST Start Hour     :{{.FanvilStart.Hour}}
DST End Mon        :{{.FanvilEnd.Month}}
DST End Week       :{{.FanvilEnd.Week}}
DST End Wday       :{{.FanvilEnd.Weekday}}
DST End Hour       :{{.FanvilEnd.Hour}}
{{- else}}
DST Type           :0
{{- end}}
{{- end}}
{{- end}}

<MMI CONFIG MODULE>
{{- /* Web UI account: the Fanvil configuration export keeps the web accounts in --MMI Account-- (Account1 is admin, level 10). The per-phone password is the same one every other vendor gets. */}}
--MMI Account--    :
Account1 Name      :admin
Account1 Password  :{{.Phone.AdminPassword}}
Account1 Level     :10
{{- /* BLF keys are placed by Render (internal/prov/keycaps.go): DSS key pages of the model, "--Dsskey Config1--:" first, numbered from 1 on each page; keys past the last page are dropped. */}}
{{- if .BLF}}

<DSSKEY CONFIG MODULE>
{{- range $i, $k := .BLF}}
{{- if $k.PageStart}}
--{{$k.Section}} Config{{$k.Page}}--:
{{- end}}
Fkey{{$k.Slot}} Type        :1
Fkey{{$k.Slot}} Value       :{{$k.Number}}@1/b
Fkey{{$k.Slot}} Title       :{{$k.Label}}
{{- end}}
{{- end}}
{{- with .Book}}

<PHONEBOOK CONFIG MODULE>
--Remote Phonebook List-- :
Remote Phonebook1 URL    :{{.URL}}
Remote Phonebook1 Name   :Directory
Remote Phonebook Update  :{{.RefreshMinutes}}
{{- end}}

<AUTOUPDATE CONFIG MODULE>
CACertURL          :{{.Prov.CAURL}}
Flash Server IP    :{{urlhost .Prov.URL}}
Flash File Name    :{{urlpath .Prov.URL}}$mac.cfg
Flash Protocol     :5
Flash Mode         :2
Flash Interval     :{{default 1 (div .Prov.ResyncSeconds 3600)}}
{{- with .Firmware}}
Auto Image Url     :{{.URL}}
{{- end}}
<<END OF FILE>>
