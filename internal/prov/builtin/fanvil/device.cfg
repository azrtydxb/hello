<<VOIP CONFIG FILE>>Version:2.0002

<GLOBAL CONFIG MODULE>
SNTP Server        :{{.Time.NTP}}
Time Zone Name     :{{.Time.Zone}}

<SIP CONFIG MODULE>
--SIP Line List--  :
SIP1 PhoneNumber   :{{.Line.Username}}
SIP1 DisplayName   :{{.Line.DisplayName}}
SIP1 SipName       :{{.Line.Label}}
SIP1 RegisterAddr  :{{.Server.Host}}
SIP1 RegisterPort  :{{.Server.Port}}
SIP1 RegisterUser  :{{.Line.AuthName}}
SIP1 RegisterPswd  :{{.Line.Password}}
SIP1 RegisterTTL   :{{.Server.Expiry}}
SIP1 EnableReg     :1
SIP1 Transport     :0
{{- with .Line.VoicemailCode}}
SIP1 MWINum        :{{.}}
{{- end}}

<WEB CONFIG MODULE>
--Web User List--  :
admin AdminPswd    :{{.Phone.AdminPassword}}

<DSS CONFIG MODULE>
{{- range $i, $k := .BLF}}
Fkey{{add $i 1}} Type        :1
Fkey{{add $i 1}} Value       :{{$k.Number}}@1/b
Fkey{{add $i 1}} Title       :{{$k.Label}}
{{- end}}

<AUTOUPDATE CONFIG MODULE>
CACertURL          :{{.Prov.CAURL}}
FlashServerIP      :{{.Prov.URL}}
FlashProtocol      :5
FlashMode          :1
FlashInterval      :{{div .Prov.ResyncSeconds 3600}}
{{- with .Firmware}}
EnableAutoUpgrade  :1
UpgradeServer1     :{{.URL}}
{{- end}}
<<END OF FILE>>
