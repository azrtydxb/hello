<<VOIP CONFIG FILE>>Version:2.0002

<SIP CONFIG MODULE>
--SIP Line List--  :
SIP1 Phone Number  :{{.Line.Username}}
SIP1 Display Name  :{{.Line.DisplayName}}
SIP1 Sip Name      :{{.Line.AccountLabel}}
SIP1 Register Addr :{{.Server.Host}}
SIP1 Register Port :{{.Server.Port}}
SIP1 Register User :{{.Line.AuthName}}
SIP1 Register Pswd :{{.Line.Password}}
SIP1 Register TTL  :{{.Server.Expiry}}
SIP1 Enable Reg    :1
SIP1 Transport     :0
{{- /* MWI (spec S-1): SIP1 MWI Num is the voicemail number. No Fanvil subscribe-MWI key is documented where we could cite it, so none is written and MWI reaches Fanvil as the unsolicited NOTIFY. Unverified on hardware (lab item 1). */}}
SIP1 MWI Num       :{{or .Line.VoicemailCode "*97"}}

<PHONE FEATURE MODULE>
Enable SNTP        :1
SNTP Server        :{{.Time.NTP}}
{{- with .Time.TZ}}
{{- if .Known}}
Time Zone          :{{.FanvilOffset}}
Time Zone Name     :{{.FanvilName}}
{{- if .DST}}
DST Type           :1
DST Rule Mode      :0
DST Min Offset     :{{.SaveMinutes}}
DST Start Mon      :{{.FanvilStart.Month}}
DST Start Week     :{{.FanvilStart.Week}}
DST Start Wday     :{{.FanvilStart.Weekday}}
DST Start Hour     :{{.FanvilStart.Hour}}
DST End Mon        :{{.FanvilEnd.Month}}
DST End Week       :{{.FanvilEnd.Week}}
DST End Wday       :{{.FanvilEnd.Weekday}}
DST End Hour       :{{.FanvilEnd.Hour}}
{{- else}}
DST Type           :0
{{- end}}
{{- end}}
{{- end}}

<WEB CONFIG MODULE>
--Web User List--  :
admin AdminPswd    :{{.Phone.AdminPassword}}

<DSS CONFIG MODULE>
{{- range $i, $k := .BLF}}
Fkey{{add $i 1}} Type        :1
Fkey{{add $i 1}} Value       :{{$k.Number}}@1/b
Fkey{{add $i 1}} Title       :{{$k.Label}}
{{- end}}
{{- with .Book}}

<PHONEBOOK CONFIG MODULE>
--Remote Phonebook List-- :
Remote Phonebook1 URL    :{{.URL}}
Remote Phonebook1 Name   :Directory
Remote Phonebook Update  :{{.RefreshMinutes}}
{{- end}}

<AUTOUPDATE CONFIG MODULE>
CACertURL          :{{.Prov.CAURL}}
Flash Server IP    :{{urlhost .Prov.URL}}
Flash File Name    :{{urlpath .Prov.URL}}$mac.cfg
Flash Protocol     :5
Flash Mode         :2
Flash Interval     :{{default 1 (div .Prov.ResyncSeconds 3600)}}
{{- with .Firmware}}
Auto Image Url     :{{.URL}}
{{- end}}
<<END OF FILE>>
