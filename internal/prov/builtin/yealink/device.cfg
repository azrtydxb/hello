#!version:1.0.0.1
## Kuvryn Hello: {{.Phone.Model}} {{.Phone.MAC}}{{with .Phone.Label}} ({{.}}){{end}}
account.1.enable = 1
account.1.label = {{.Line.AccountLabel}}
account.1.display_name = {{.Line.DisplayName}}
account.1.auth_name = {{.Line.AuthName}}
account.1.user_name = {{.Line.Username}}
account.1.password = {{.Line.Password}}
account.1.sip_server.1.address = {{.Server.Host}}
account.1.sip_server.1.port = {{.Server.Port}}
account.1.sip_server.1.transport_type = {{if eq .Server.Transport "tls"}}2{{else}}0{{end}}
account.1.sip_server.1.expires = {{.Server.Expiry}}
{{- /* HD voice: codec order Opus (models that have it), G.722, PCMU, PCMA; everything else off. Keys: Yealink SIP IP Phones Administrator Guide, "Audio Codecs" (account.X.codec.<name>.enable and .priority; priority 1 is tried first; names g722, opus, pcmu, pcma, g729, g726_16 to g726_40, g723_53, g723_63, ilbc_13_33kbps). Hello provisions account 1; another account of a multi-account model takes the same keys with its own number in account.N. Unverified on hardware (verify). */}}
{{- if .Codecs.Opus}}
account.1.codec.opus.enable = 1
account.1.codec.opus.priority = 1
account.1.codec.g722.enable = 1
account.1.codec.g722.priority = 2
account.1.codec.pcmu.enable = 1
account.1.codec.pcmu.priority = 3
account.1.codec.pcma.enable = 1
account.1.codec.pcma.priority = 4
{{- else}}
account.1.codec.g722.enable = 1
account.1.codec.g722.priority = 1
account.1.codec.opus.enable = 0
account.1.codec.pcmu.enable = 1
account.1.codec.pcmu.priority = 2
account.1.codec.pcma.enable = 1
account.1.codec.pcma.priority = 3
{{- end}}
account.1.codec.g729.enable = 0
account.1.codec.g726_16.enable = 0
account.1.codec.g726_24.enable = 0
account.1.codec.g726_32.enable = 0
account.1.codec.g726_40.enable = 0
account.1.codec.g723_53.enable = 0
account.1.codec.g723_63.enable = 0
account.1.codec.ilbc_13_33kbps.enable = 0
{{- /* MWI (spec S-1): subscribe_mwi per the Yealink auto-provisioning guide, verify on hardware (lab item 1). */}}
account.1.subscribe_mwi = 1
account.1.subscribe_mwi_expires = 3600
## Text messages (SIP MESSAGE, RFC 3428): show the Text Message menu and softkey. Source: Yealink
## SIP IP Phones Administrator Guide, features.text_message.enable. UNVERIFIED on hardware (verify
## on a T4x or T5x); a phone that does not know the key ignores it. Hello answers 202/200 and delivers
## to every phone of the extension.
features.text_message.enable = 1
{{- /* Feature Key Synchronization (spec S-7): DND and call forward follow Hello over SUBSCRIBE Event: as-feature-event. From Yealink's own configuration template as shipped in FusionPBX's Yealink templates (V84 and later account.X.feature_key_sync.enable plus the dnd and forward switches) and the older global features.feature_key_sync.enable that T3/T4/T5/T7/T8 templates still carry; not checked on a phone (verify). */}}
features.feature_key_sync.enable = 1
account.1.feature_key_sync.enable = 1
account.1.dnd.feature_key_sync.enable = 1
account.1.forward.feature_key_sync.enable = 1
{{- with .Line.VoicemailCode}}
voice_mail.number.1 = {{.}}
{{- end}}
## QoS marking (phone-feature-parity S-21): static.network.qos.signaltos is the DSCP of SIP
## and static.network.qos.audiotos the DSCP of RTP, 0 to 63 (Yealink SIP IP Phones
## Administrator Guide, "Quality of Service"). The values hello-sip marks its own sockets
## with. Not confirmed on a phone (verify).
static.network.qos.signaltos = {{.Prov.DSCPSIP}}
static.network.qos.audiotos = {{.Prov.DSCPRTP}}
## Call waiting (phone-feature-parity S-18), written from the extension's flag so the phone
## agrees with Hello: call_waiting.enable and call_waiting.tone (Yealink SIP IP Phones
## Administrator Guide, "Call Waiting"; the same keys appear in other provisioning
## templates). Not yet confirmed on a phone (verify, lab item 26).
call_waiting.enable = {{if .Line.CallWaiting}}1{{else}}0{{end}}
call_waiting.tone = {{if .Line.CallWaiting}}1{{else}}0{{end}}
{{- /* Call pickup (phone-feature-parity S-50): features.pickup.* from the Yealink Administrator Guide, "Call Pickup"; the phone dials the code, with the extension after it for a directed pickup. Verify on a phone. */}}
{{- with .Line.PickupGroupCode}}
features.pickup.group_pickup_enable = 1
features.pickup.group_pickup_code = {{.}}
{{- end}}
{{- with .Line.PickupDirectedCode}}
features.pickup.direct_pickup_enable = 1
features.pickup.direct_pickup_code = {{.}}
{{- end}}
{{- /* BLF keys are placed on the model's keys by Render (internal/prov/keycaps.go): linekey.2 up to the model's last line key (linekey.1 is the account), then expansion_module.N.key.M on phones that take the EXP50; keys past the last are dropped. linekey.X.pickup_value is the directed-pickup code of a BLF line key (Yealink configuration template: "BLF require pickup_value"); no pickup value is written for an expansion key: the Yealink template files name that field differently between versions (expansion_module.X.key.Y.extension) and none of the sources names the current one. */}}
{{- range $i, $k := .BLF}}
{{- if $k.Module}}
expansion_module.{{$k.Module}}.key.{{$k.Slot}}.type = 16
expansion_module.{{$k.Module}}.key.{{$k.Slot}}.line = 1
expansion_module.{{$k.Module}}.key.{{$k.Slot}}.value = {{$k.Number}}
expansion_module.{{$k.Module}}.key.{{$k.Slot}}.label = {{$k.Label}}
{{- else}}
linekey.{{$k.Slot}}.type = 16
linekey.{{$k.Slot}}.line = 1
linekey.{{$k.Slot}}.value = {{$k.Number}}
linekey.{{$k.Slot}}.label = {{$k.Label}}
{{- with $k.Pickup}}
linekey.{{$k.Slot}}.pickup_value = {{.}}
{{- end}}
{{- end}}
{{- end}}
## Paging and intercom (Kuvryn Hello phonebooks-ptt spec P-12, P-13): accept auto-answer
## requests from the PBX (Call-Info answer-after=0), with the intercom tone and not muted;
## an intercom call breaks into a call in progress only when the phone group's intercom
## barging option is on.
## Source: Yealink SIP IP Phones Administrator Guide, "Intercom" (features.intercom.*); the
## Alert-Info value Hello sends is still to be confirmed on hardware (verify).
features.intercom.allow = 1
features.intercom.mute = 0
features.intercom.tone = 1
features.intercom.barge = {{with .Paging}}{{.IntercomBarge}}{{else}}0{{end}}
{{- /* Multicast paging (phonebooks-ptt P-15), keys as in the spec's vendor table from the Yealink Administrator Guide, "Multicast Paging" (verify on a phone). */}}
{{- with .Multicast}}
multicast.codec = {{.Codec}}
multicast.receive_priority.enable = 1
{{- range $i, $c := .Listen}}
multicast.listen_address.{{add $i 1}}.ip_address = {{$c.HostPort}}
multicast.listen_address.{{add $i 1}}.label = {{$c.Label}}
{{- end}}
{{- range $i, $c := .Send}}
multicast.paging_address.{{add $i 1}}.ip_address = {{$c.HostPort}}
multicast.paging_address.{{add $i 1}}.label = {{$c.Label}}
multicast.paging_address.{{add $i 1}}.channel = {{add $i 1}}
{{- end}}
{{- end}}
static.security.user_password = admin:{{.Phone.AdminPassword}}
static.trusted_certificates.url = {{.Prov.CAURL}}
static.security.trust_certificates = 1
static.auto_provision.server.url = {{.Prov.URL}}
static.auto_provision.dhcp_option.enable = 0
static.auto_provision.repeat.enable = 1
static.auto_provision.repeat.minutes = {{div .Prov.ResyncSeconds 60}}
local_time.ntp_server1 = {{.Time.NTP}}
{{- with .Time.TZ}}
{{- if .Known}}
local_time.time_zone = {{.YealinkOffset}}
{{- with .YealinkName}}
local_time.time_zone_name = {{.}}
{{- end}}
{{- if .DST}}
local_time.summer_time = 1
local_time.dst_time_type = 1
local_time.start_time = {{.YealinkStart}}
local_time.end_time = {{.YealinkEnd}}
local_time.offset_time = {{.SaveMinutes}}
{{- else}}
local_time.summer_time = 0
{{- end}}
{{- end}}
{{- end}}
{{- with .Firmware}}
static.firmware.url = {{.URL}}
{{- end}}
{{- with .Book}}
features.remote_phonebook.enable = 1
features.remote_phonebook.flash_time = {{.RefreshSeconds}}
{{- range $i, $s := .Sources}}
remote_phonebook.data.{{add $i 1}}.url = {{$s.URL}}
remote_phonebook.data.{{add $i 1}}.name = {{$s.Name}}
{{- end}}
{{- end}}
