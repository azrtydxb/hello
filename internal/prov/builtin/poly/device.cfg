<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Kuvryn Hello: {{xml .Phone.Model}} {{.Phone.MAC}}. Hello CA certificate: {{xml .Prov.CAURL}} -->
<polycomConfig>
  <reg reg.1.address="{{xml .Line.Username}}" reg.1.auth.userId="{{xml .Line.AuthName}}" reg.1.auth.password="{{xml .Line.Password}}" reg.1.label="{{xml .Line.AccountLabel}}" reg.1.displayName="{{xml .Line.DisplayName}}" reg.1.server.1.address="{{xml .Server.Host}}" reg.1.server.1.port="{{.Server.Port}}" reg.1.server.1.transport="UDPOnly" reg.1.server.1.expires="{{.Server.Expiry}}"/>
{{- /* MWI (spec S-1): msg.mwi.N.subscribe names the URI the phone SUBSCRIBEs to (Poly UC Software admin guide), verify on hardware (lab item 1). */}}
  <msg msg.mwi.1.subscribe="{{xml .Line.Username}}"{{with .Line.VoicemailCode}} msg.mwi.1.callBackMode="contact" msg.mwi.1.callBack="{{xml .}}"{{end}}/>
{{- /* Call waiting (phone-feature-parity S-18): call.callWaiting.enable is the switch and call.callWaiting.ring the tone (beep, ring or silent) in the UC Software Administrator Guide. Unverified on a VVX (verify, lab item 26). */}}
  <call call.callWaiting.enable="{{if .Line.CallWaiting}}1{{else}}0{{end}}" call.callWaiting.ring="beep"/>
  <attendant attendant.reg="1"{{range $i, $k := .BLF}} attendant.resourceList.{{add $i 1}}.address="{{xml $k.URI}}" attendant.resourceList.{{add $i 1}}.label="{{xml $k.Label}}"{{end}}/>
  <device device.set="1" device.prov.serverName="{{xml .Prov.URL}}" device.prov.serverName.set="1" device.prov.serverType="HTTPS" device.prov.serverType.set="1" device.dhcp.bootSrvUseOpt="Static" device.dhcp.bootSrvUseOpt.set="1" device.prov.tagSerialNo="1" device.prov.tagSerialNo.set="1" device.auth.localAdminPassword="{{xml .Phone.AdminPassword}}" device.auth.localAdminPassword.set="1" device.sntp.serverName="{{xml .Time.NTP}}" device.sntp.serverName.set="1"{{with .Prov.CACertPEM}} device.sec.TLS.customCaCert1="{{xml .}}" device.sec.TLS.customCaCert1.set="1"{{end}}/>
  <!-- Paging and intercom (Kuvryn Hello phonebooks-ptt spec P-12, P-13): the Alert-Info text
       Hello sends selects the auto-answer ring class. Source: Poly UC Software Administrator
       Guide, voIpProt.SIP.alertInfo.x.value/.class with class ringAutoAnswer (verify on a VVX). -->
  <voIpProt voIpProt.SIP.alertInfo.1.value="Auto Answer" voIpProt.SIP.alertInfo.1.class="ringAutoAnswer"/>
{{- /* Group paging (phonebooks-ptt P-15): Poly's page mode takes one multicast address and port with up to 25 labelled groups; Hello writes the first listening channel and one group per channel. ptt.pageMode.* from the UC Software Administrator Guide, "Group Paging" (verify on a VVX). */}}
{{- with .Multicast}}{{if .Listen}}
  <ptt ptt.pageMode.enable="1" ptt.pageMode.address="{{xml (index .Listen 0).Address}}" ptt.pageMode.port="{{(index .Listen 0).Port}}" ptt.pageMode.codec="{{xml .PolyCodec}}"{{range $i, $c := .Listen}} ptt.pageMode.group.{{add $i 1}}.label="{{xml $c.Label}}" ptt.pageMode.group.{{add $i 1}}.subscribed="1"{{end}}/>
{{- end}}{{end}}
  <prov prov.polling.enabled="1" prov.polling.mode="rel" prov.polling.period="{{.Prov.ResyncSeconds}}"/>
  <tcpIpApp tcpIpApp.sntp.address="{{xml .Time.NTP}}"{{with .Time.TZ}}{{if .Known}} tcpIpApp.sntp.gmtOffset="{{.OffsetSeconds}}" tcpIpApp.sntp.gmtOffset.overrideDHCP="1"{{if .DST}} tcpIpApp.sntp.daylightSavings.enable="1" tcpIpApp.sntp.daylightSavings.fixedDayEnable="0" tcpIpApp.sntp.daylightSavings.start.month="{{.PolyStart.Month}}" tcpIpApp.sntp.daylightSavings.start.date="{{.PolyStart.Date}}" tcpIpApp.sntp.daylightSavings.start.time="{{.PolyStart.Hour}}" tcpIpApp.sntp.daylightSavings.start.dayOfWeek="{{.PolyStart.DayOfWeek}}" tcpIpApp.sntp.daylightSavings.start.dayOfWeek.lastInMonth="{{.PolyStart.LastInMonth}}" tcpIpApp.sntp.daylightSavings.stop.month="{{.PolyEnd.Month}}" tcpIpApp.sntp.daylightSavings.stop.date="{{.PolyEnd.Date}}" tcpIpApp.sntp.daylightSavings.stop.time="{{.PolyEnd.Hour}}" tcpIpApp.sntp.daylightSavings.stop.dayOfWeek="{{.PolyEnd.DayOfWeek}}" tcpIpApp.sntp.daylightSavings.stop.dayOfWeek.lastInMonth="{{.PolyEnd.LastInMonth}}"{{else}} tcpIpApp.sntp.daylightSavings.enable="0"{{end}}{{end}}{{end}}/>
{{- if .Book}}
  <dir dir.local.readonly="1"/>
{{- end}}
</polycomConfig>
