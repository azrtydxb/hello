<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Kuvryn Hello: {{xml .Phone.Model}} {{.Phone.MAC}}. Hello CA certificate: {{xml .Prov.CAURL}} -->
<polycomConfig>
  <reg reg.1.address="{{xml .Line.Username}}" reg.1.auth.userId="{{xml .Line.AuthName}}" reg.1.auth.password="{{xml .Line.Password}}" reg.1.label="{{xml .Line.Label}}" reg.1.displayName="{{xml .Line.DisplayName}}" reg.1.server.1.address="{{xml .Server.Host}}" reg.1.server.1.port="{{.Server.Port}}" reg.1.server.1.transport="UDPOnly" reg.1.server.1.expires="{{.Server.Expiry}}"/>
{{- with .Line.VoicemailCode}}
  <msg msg.mwi.1.callBackMode="contact" msg.mwi.1.callBack="{{xml .}}"/>
{{- end}}
  <attendant attendant.reg="1"{{range $i, $k := .BLF}} attendant.resourceList.{{add $i 1}}.address="{{xml $k.URI}}" attendant.resourceList.{{add $i 1}}.label="{{xml $k.Label}}"{{end}}/>
  <device device.set="1" device.prov.serverName="{{xml .Prov.URL}}" device.prov.serverName.set="1" device.prov.serverType="HTTPS" device.prov.serverType.set="1" device.prov.tagSerialNo="1" device.prov.tagSerialNo.set="1" device.auth.localAdminPassword="{{xml .Phone.AdminPassword}}" device.auth.localAdminPassword.set="1" device.sntp.serverName="{{xml .Time.NTP}}" device.sntp.serverName.set="1"{{with .Prov.CACertPEM}} device.sec.TLS.customCaCert1="{{xml .}}" device.sec.TLS.customCaCert1.set="1"{{end}}/>
  <prov prov.polling.enabled="1" prov.polling.mode="rel" prov.polling.period="{{.Prov.ResyncSeconds}}"/>
  <tcpIpApp tcpIpApp.sntp.address="{{xml .Time.NTP}}"/>
</polycomConfig>
