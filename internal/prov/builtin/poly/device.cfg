<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Kuvryn Hello: {{xml .Phone.Model}} {{.Phone.MAC}}. Hello CA certificate: {{xml .Prov.CAURL}} -->
<polycomConfig>
  <reg reg.1.address="{{xml .Line.Username}}" reg.1.auth.userId="{{xml .Line.AuthName}}" reg.1.auth.password="{{xml .Line.Password}}" reg.1.label="{{xml .Line.AccountLabel}}" reg.1.displayName="{{xml .Line.DisplayName}}" reg.1.serverFeatureControl.dnd="1" reg.1.serverFeatureControl.cf="1" reg.1.server.1.address="{{xml .Server.Host}}" reg.1.server.1.port="{{.Server.Port}}" reg.1.server.1.transport="UDPOnly" reg.1.server.1.expires="{{.Server.Expiry}}"/>
{{- /* MWI (spec S-1): msg.mwi.N.subscribe names the URI the phone SUBSCRIBEs to (Poly UC Software admin guide), verify on hardware (lab item 1). */}}
{{- /* Text messages (SIP MESSAGE, RFC 3428): Poly UC Software documents no key to switch instant messages on that we could cite, so none is written; the phone shows a MESSAGE it receives as it does by default. Unverified on hardware (lab item). */}}
  <msg msg.mwi.1.subscribe="{{xml .Line.Username}}"{{with .Line.VoicemailCode}} msg.mwi.1.callBackMode="contact" msg.mwi.1.callBack="{{xml .}}"{{end}}/>
  <voice {{if .Codecs.Opus}}voice.codecPref.Opus="1" voice.codecPref.G722="2" voice.codecPref.G711_Mu="3" voice.codecPref.G711_A="4"{{else}}voice.codecPref.G722="1" voice.codecPref.G711_Mu="2" voice.codecPref.G711_A="3"{{end}} voice.codecPref.G729_AB="" voice.codecPref.G7221.16kbps="" voice.codecPref.G7221.24kbps="" voice.codecPref.G7221.32kbps="" voice.codecPref.G7221_C.24kbps="" voice.codecPref.G7221_C.32kbps="" voice.codecPref.G7221_C.48kbps="" voice.codecPref.Siren14.48kbps="" voice.codecPref.Siren22.64kbps=""/>
{{- /* QoS marking (phone-feature-parity S-21): qos.ip.callControl.dscp is the DSCP of SIP and qos.ip.rtp.dscp the DSCP of RTP, 0 to 63 (Poly UC Software Administrator Guide, "IP Type-of-Service"); the values hello-sip marks its own sockets with. Not confirmed on a phone (verify). */}}
  <qos qos.ip.callControl.dscp="{{.Prov.DSCPSIP}}" qos.ip.rtp.dscp="{{.Prov.DSCPRTP}}"/>
{{- /* Call waiting (phone-feature-parity S-18): call.callWaiting.enable is the switch and call.callWaiting.ring the tone (beep, ring or silent) in the UC Software Administrator Guide. Unverified on a VVX (verify, lab item 26). */}}
  <call call.callWaiting.enable="{{if .Line.CallWaiting}}1{{else}}0{{end}}" call.callWaiting.ring="beep"/>
{{- /* Call pickup (phone-feature-parity S-50): call.directedCallPickupString and call.groupCallPickupString from the Poly UC Software Administrator Guide (verify on a VVX). */}}
{{- if or .Line.PickupDirectedCode .Line.PickupGroupCode}}
  <call{{with .Line.PickupDirectedCode}} call.directedCallPickupString="{{xml .}}"{{end}}{{with .Line.PickupGroupCode}} call.groupCallPickupString="{{xml .}}"{{end}}/>
{{- end}}
  <attendant attendant.reg="1"{{range $i, $k := .BLF}} attendant.resourceList.{{add $i 1}}.address="{{xml $k.URI}}" attendant.resourceList.{{add $i 1}}.label="{{xml $k.Label}}"{{end}}/>
{{- /* Transfer-to-voicemail softkey (Hello's *97<ext>): an enhanced feature key macro that blind-transfers the active call, shown on the softkey bar while a call is active. efk.efklist.N.* and softkey.N.* (action "!" and the macro name) are from the Poly UC Software Administrator Guide, "Enhanced Feature Keys" and "Soft Keys"; the macro ($FTransfer$, pause, the digits, $Tinvite$), the softkey slot (1, no other softkey is written by Hello) and the use.* contexts are not checked on a VVX (verify). */}}
{{- with .VMKey}}
  <feature feature.enhancedFeatureKeys.enabled="1"/>
  <efk efk.version="2" efk.efklist.1.mname="hellovm" efk.efklist.1.status="1" efk.efklist.1.label="{{xml .Label}}" efk.efklist.1.type="invite" efk.efklist.1.action.string="$FTransfer$$Cpause2${{xml .Number}}$Tinvite$"/>
  <softkey softkey.1.label="{{xml .Label}}" softkey.1.action="!hellovm" softkey.1.enable="1" softkey.1.use.active="1" softkey.1.use.idle="0" softkey.1.use.alerting="0" softkey.1.use.dialtone="0" softkey.1.use.hold="1"/>
{{- end}}
  <device device.set="1" device.prov.serverName="{{xml .Prov.URL}}" device.prov.serverName.set="1" device.prov.serverType="HTTPS" device.prov.serverType.set="1" device.dhcp.bootSrvUseOpt="Static" device.dhcp.bootSrvUseOpt.set="1" device.prov.tagSerialNo="1" device.prov.tagSerialNo.set="1" device.auth.localAdminPassword="{{xml .Phone.AdminPassword}}" device.auth.localAdminPassword.set="1" device.sntp.serverName="{{xml .Time.NTP}}" device.sntp.serverName.set="1"{{with .Prov.CACertPEM}} device.sec.TLS.customCaCert1="{{xml .}}" device.sec.TLS.customCaCert1.set="1"{{end}}/>
  <!-- Paging and intercom (Kuvryn Hello phonebooks-ptt spec P-12, P-13): the Alert-Info text
       Hello sends selects the auto-answer ring class. Source: Poly UC Software Administrator
       Guide, voIpProt.SIP.alertInfo.x.value/.class with class ringAutoAnswer (verify on a VVX). -->
  <voIpProt voIpProt.SIP.alertInfo.1.value="Auto Answer" voIpProt.SIP.alertInfo.1.class="ringAutoAnswer"/>
{{- /* Feature Key Synchronization (spec S-7): reg.1.serverFeatureControl.dnd and .cf on the line (above) make the DND and call-forward keys follow Hello over SUBSCRIBE Event: as-feature-event, as in the Poly VVX templates FusionPBX and FS PBX ship; voIpProt.SIP.serverFeatureControl.dnd and .cf are the same switch for every line (Poly UC Software Administrator Guide). Not checked on a VVX (verify). */}}
  <voIpProt voIpProt.SIP.serverFeatureControl.dnd="1" voIpProt.SIP.serverFeatureControl.cf="1"/>
{{- /* Group paging (phonebooks-ptt P-15): Poly's page mode takes one multicast address and port with up to 25 labelled groups; Hello writes the first listening channel and one group per channel. ptt.pageMode.* from the UC Software Administrator Guide, "Group Paging" (verify on a VVX). */}}
{{- with .Multicast}}{{if .Listen}}
  <ptt ptt.pageMode.enable="1" ptt.pageMode.address="{{xml (index .Listen 0).Address}}" ptt.pageMode.port="{{(index .Listen 0).Port}}" ptt.pageMode.codec="{{xml .PolyCodec}}"{{range $i, $c := .Listen}} ptt.pageMode.group.{{add $i 1}}.label="{{xml $c.Label}}" ptt.pageMode.group.{{add $i 1}}.subscribed="1"{{end}}/>
{{- end}}{{end}}
  <prov prov.polling.enabled="1" prov.polling.mode="rel" prov.polling.period="{{.Prov.ResyncSeconds}}"/>
  <tcpIpApp tcpIpApp.sntp.address="{{xml .Time.NTP}}"{{with .Time.TZ}}{{if .Known}} tcpIpApp.sntp.gmtOffset="{{.OffsetSeconds}}" tcpIpApp.sntp.gmtOffset.overrideDHCP="1"{{if .DST}} tcpIpApp.sntp.daylightSavings.enable="1" tcpIpApp.sntp.daylightSavings.fixedDayEnable="0" tcpIpApp.sntp.daylightSavings.start.month="{{.PolyStart.Month}}" tcpIpApp.sntp.daylightSavings.start.date="{{.PolyStart.Date}}" tcpIpApp.sntp.daylightSavings.start.time="{{.PolyStart.Hour}}" tcpIpApp.sntp.daylightSavings.start.dayOfWeek="{{.PolyStart.DayOfWeek}}" tcpIpApp.sntp.daylightSavings.start.dayOfWeek.lastInMonth="{{.PolyStart.LastInMonth}}" tcpIpApp.sntp.daylightSavings.stop.month="{{.PolyEnd.Month}}" tcpIpApp.sntp.daylightSavings.stop.date="{{.PolyEnd.Date}}" tcpIpApp.sntp.daylightSavings.stop.time="{{.PolyEnd.Hour}}" tcpIpApp.sntp.daylightSavings.stop.dayOfWeek="{{.PolyEnd.DayOfWeek}}" tcpIpApp.sntp.daylightSavings.stop.dayOfWeek.lastInMonth="{{.PolyEnd.LastInMonth}}"{{else}} tcpIpApp.sntp.daylightSavings.enable="0"{{end}}{{end}}{{end}}/>
{{- if .Book}}
  <dir dir.local.readonly="1"/>
{{- end}}
</polycomConfig>
