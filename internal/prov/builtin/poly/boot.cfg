<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Kuvryn Hello bootstrap: no account here. Hello CA certificate: {{xml .Prov.CAURL}} -->
<polycomConfig>
  <device device.set="1" device.prov.serverName="{{xml .Prov.URL}}" device.prov.serverName.set="1" device.prov.serverType="HTTPS" device.prov.serverType.set="1" device.dhcp.bootSrvUseOpt="2" device.dhcp.bootSrvUseOpt.set="1"{{with .Prov.CACertPEM}} device.sec.TLS.customCaCert1="{{xml .}}" device.sec.TLS.customCaCert1.set="1"{{end}}/>
  <prov prov.polling.enabled="1" prov.polling.mode="rel" prov.polling.period="{{.Prov.ResyncSeconds}}"/>
</polycomConfig>
