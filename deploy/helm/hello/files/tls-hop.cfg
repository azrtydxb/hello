# Kamailio tls module configuration when the TLS hop to Hello is on
# (KAMAILIO_HELLO_TLS_PORT, see kamailio.cfg; clients-webrtc-mobile-video
# S-12). It replaces tls.cfg then: the same server settings for phones, plus
# the CA and a client certificate for the connections Kamailio opens.
#
# The certificate is the one of SIP over TLS (the Hello CA's, mounted with its
# ca.crt at /etc/hello-tls) and must be usable as a server and as a client
# certificate: hello-sip requires a client certificate on its TLS port, and
# Kamailio verifies the node's certificate against the CA. Hello's own
# connections to the hello_tls socket are vetted by their source address, as
# the UDP hello socket is.
#
# Connections Kamailio opens verify the far side, so a phone that has no
# connection to reuse cannot be dialled over TLS with an unverifiable
# certificate: that is the point of the hop, and phones normally reuse their
# own connection.
[server:default]
method = TLSv1.2+
certificate = /etc/hello-tls/tls.crt
private_key = /etc/hello-tls/tls.key
ca_list = /etc/hello-tls/ca.crt
verify_certificate = no
require_certificate = no

[client:default]
method = TLSv1.2+
certificate = /etc/hello-tls/tls.crt
private_key = /etc/hello-tls/tls.key
ca_list = /etc/hello-tls/ca.crt
verify_certificate = yes
require_certificate = yes
