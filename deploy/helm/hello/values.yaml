# Hello on Kubernetes. docs/kubernetes.md explains every choice below.
#
# Required (the chart refuses to render without them):
#   global.sipDomain          the SIP domain phones register to
#   kamailio.publicHost       the address phones reach Kamailio at
#   secrets.existingSecret    a Secret you create (see docs/kubernetes.md)
# and a Valkey and a MinIO: bundled (evaluation) or external (production).

global:
  # Images are <imageRegistry>/<name>:<tag>. Pin an immutable tag
  # (sha-<commit>) for anything but evaluation; "main" moves.
  imageRegistry: ant.kw.watteel.lab/oci-hosted/azrtydxb
  imageTag: main
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  clusterDomain: cluster.local
  # The SIP domain (HELLO_SIP_DOMAIN): the host part of the phones' AOR.
  sipDomain: ""
  # Voicemail voice (docs/voicemail.md): the language of the spoken prompts
  # (HELLO_VOICEMAIL_LANGUAGE: en or nl) and the IANA time zone message times
  # are spoken in (HELLO_TIMEZONE on hello-sip).
  voicemailLanguage: en
  timezone: UTC
  # Public HTTPS URL of the console and API (HELLO_PUBLIC_URL); enables
  # the OAuth/MCP issuer. Empty leaves it unset.
  publicUrl: ""

secrets:
  # The chart never creates credentials. This Secret must hold:
  #   dsn                PostgreSQL connection string (HELLO_DATABASE_URL)
  #   secretKey          openssl rand -base64 32 (HELLO_SECRET_KEY)
  #   nonceSecret        at least 32 bytes (HELLO_SIP_NONCE_SECRET)
  #   bootstrapPassword  first admin's password (HELLO_BOOTSTRAP_ADMIN_PASSWORD)
  #   minioAccessKey / minioSecretKey
  # and, when postgresql.enabled: postgresUser, postgresPassword.
  # Optional keys (control reads them with optional: true): provider,
  # base-url, model, api-key (the AI agent); clientAuthKey and
  # clientAuthKeyPrevious (web device credentials, at least 32 bytes, on
  # control and sip); turnSecret (coturn's static-auth-secret, at least 16
  # bytes; required when coturn.enabled).
  existingSecret: ""
  # Vendor redirect-service credentials for phone provisioning, a Secret
  # with the keys documented in docs/provisioning.md. Empty: unconfigured.
  provRedirectSecret: ""

control:
  replicas: 2
  image:
    name: hello-control
    tag: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    # An announcement upload (up to 64 MiB) is held in memory while it is
    # converted, about 1.5x its size.
    limits: { memory: 512Mi }
  # LAN chat widget listener (docs/inbox.md, "Website chat"): its own port
  # serving only /chat/*, reached through the UI's /chat/ on the LAN host.
  # Off until lanAddr is set (for example ":8087").
  chat:
    lanAddr: ""
    # The global kill switch: false makes every /chat request answer 503.
    enabled: true
    # Proxies whose X-Forwarded-For is believed: the UI pods and the ingress
    # controller's pods (comma separated CIDRs). Without them every visitor
    # shares one address and one set of limits.
    trustedProxies: ""
  # Phone provisioning listener (:8083). Enabled when provisioning.publicUrl is set.
  provisioning:
    publicUrl: ""
    # Where provisioned phones register; default <kamailio.publicHost>:<kamailio.publicPort>.
    sipServer: ""
    # Backup registrars (comma separated host:port, at most 2; the first is
    # used) written to the phones that take one: Yealink and Poly (second
    # server), Grandstream (backup outbound proxy). The HA node list when
    # SRV records are not published. Empty: none (S-20).
    sipBackupServers: ""
    # A DNS name whose _sip._udp SRV records list the SIP servers (see
    # docs/provisioning.md, "SRV records and backup servers"). Set, Grandstream
    # phones use DNS SRV mode with it. Empty keeps A-record mode, the default
    # until the failover lab test passes.
    sipSrv: ""
    # With kamailio.tls.enabled, the SIP-over-TLS address (default
    # <kamailio.publicHost>:<kamailio.tls.publicPort>) and the models that
    # register over it: comma separated vendors or vendor:model-prefix
    # (default grandstream:WP; "none" keeps every phone on UDP).
    sipTlsServer: ""
    sipTlsModels: ""
    # Provision Grandstream WP810/WP822/WP825 to publish RTCP-XR voice-quality
    # reports to the SIP server (HELLO_PROV_RTCPXR, docs/provisioning.md).
    rtcpxr: false
    # Models that register over TCP (same format as sipTlsModels, default
    # none: UDP). A model also in sipTlsModels uses TLS while TLS is on.
    sipTcpModels: ""
    # Proxies whose X-Forwarded-* is believed (the ingress controller's pods).
    trustedProxies: ""
    # Secret holding ca.crt (cert-manager writes it next to the certificate);
    # mounted and served at /p/ca.crt. Empty: no CA is served.
    caSecret: ""
    ingress:
      enabled: false
      className: nginx
      host: ""
      tlsSecretName: ""
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/enable-access-log: "false"
  # Phone syslog sink (UDP :5514 in the pod, Service port 514). Off by
  # default. host is what phones are told to send to (HELLO_SYSLOG_HOST, host
  # or host:port); empty leaves syslog out of every phone configuration.
  # Local traffic policy keeps the phone's address, which attributes a line to
  # its phone.
  syslog:
    enabled: false
    host: ""
    service:
      type: ClusterIP
      nodePort: 0
      externalTrafficPolicy: Local
  # Phone LDAP directory (pbx-gaps S-24): read-only, LDAPS only. Needs
  # control.provisioning.publicUrl (phones are given its host) and a TLS
  # Secret (tls.crt, tls.key; cert-manager writes it) for the listener.
  ldap:
    enabled: false
    tlsSecret: ""
    base: dc=hello,dc=local
    # The Service port phones are given (HELLO_LDAP_PUBLIC_PORT).
    port: 636
    # Also offer StartTLS on a second Service port (389).
    startTls: false
    # Allow an anonymous bind (extensions and company books only).
    anonymous: false
    service:
      type: ClusterIP
      nodePort: null
      startTlsNodePort: null
  # Backups (docs/backup.md): the scheduler runs in every replica and one
  # takes the run. The dump and the archive are staged in an emptyDir of this
  # size before upload; it must hold the database dump plus its encrypted
  # copy. Schedule, destination and retention are set in the console.
  backup:
    stagingSize: 4Gi
  oauthDynamicClientRegistration: false
  # The API's Service. ClusterIP unless something outside the cluster
  # (a test harness, a load balancer) must reach the API directly.
  service:
    type: ClusterIP
    nodePort: null
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  # preferred | required | none. Replicas are interchangeable, so spreading
  # is preferred: a one-node cluster must still run.
  antiAffinity: preferred
  podAnnotations: {}

sip:
  # Number of hello-sip nodes (a StatefulSet: hello-sip-0 ... N-1). Two is the
  # minimum for calls to survive an upgrade or a node loss.
  nodes: 2
  image:
    name: hello-sip
    tag: ""
  # hostNetwork binds SIP (UDP 5060), HTTP 8082 and the RTP range on the node
  # address: the recommended mode, since anchored media needs a routable
  # address and no Service maps a port range. One pod per node then.
  hostNetwork: true
  rtpPortMin: 20000
  rtpPortMax: 21000
  # The IPv4 stamped into anchored SDP: "hostIP" (the node the pod runs on),
  # "podIP" (a routable pod network), or a literal IPv4 address.
  mediaAnchorHost: hostIP
  # Kamailio's addresses: only these may set Path/X-Hello-Client. Narrow it
  # to your pod CIDR (and node CIDR when Kamailio is on the host network).
  trustedProxies: "10.0.0.0/8"
  # SIP over mutual TLS from Kamailio, for the encrypted phone legs
  # (kamailio.helloTLS; docs/webrtc.md, "TLS hop"). The Secret is issued by
  # the Hello CA, carries ca.crt, names every address Kamailio dials hello-sip
  # at (the pod DNS names) and is usable as a server and a client certificate.
  tls:
    enabled: false
    port: 5061
    secretName: ""
  ringTimeout: 30s
  # A drain gives its calls to a ready survivor before the node exits. It
  # must stay below terminationGracePeriodSeconds.
  drainTimeoutSeconds: 90
  terminationGracePeriodSeconds: 150
  # How long a node told to stop waits for the hello-sip restart token and a
  # READY peer before it drains (HELLO_ROLLOUT_WAIT). 0 is off: the
  # StatefulSet's ordered RollingUpdate already replaces one pod at a time.
  # Turn it on (drainTimeoutSeconds plus this must stay below the grace
  # period) when something else restarts several nodes at once.
  rolloutWaitSeconds: 0
  # A replaced node must be ready this long before the next one is replaced.
  # Kamailio learns a replaced pod's new address from cluster DNS: answers are
  # cached for the record's TTL (CoreDNS's default is 30 s; kw's cluster uses
  # 5 s) and refreshed every 5 s, and until then it neither trusts requests
  # from the new address nor probes it. The next node's drain must not hand
  # its calls to a node Kamailio cannot yet reach, so this is above TTL plus
  # refresh plus a probe interval. Lower it only with a cluster DNS TTL to match.
  minReadySeconds: 45
  recordingNotice: true
  # Bindings one AOR may hold (HELLO_SIP_MAX_CONTACTS).
  maxContacts: 10
  # required | preferred | none. required: one node per Kubernetes node,
  # which hostNetwork needs (the ports would collide).
  antiAffinity: required
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  podAnnotations: {}

kamailio:
  image:
    name: kamailio
    tag: ""
  # One instance, or two (docs/ha.md, "Kamailio pair"): with two, give
  # nodeSelector (or affinity) the nodes they may run on, and set vip below.
  # Two instances roll one at a time (maxSurge 0, maxUnavailable 1), sit on
  # different nodes (required hostname anti-affinity) and get a
  # PodDisruptionBudget. One instance is Recreate, as before.
  replicas: 1
  # A replacement must be ready this long before its peer is touched.
  minReadySeconds: 10
  # hostNetwork binds the phones' port on the node address, so phones reach
  # Kamailio with no NAT and Kamailio sees their real source address. Pin the
  # pod to the node whose address is publicHost with nodeSelector.
  hostNetwork: true
  # Where phones reach Kamailio (REQUIRED, unless vip.enabled, which makes it
  # the VIP): a node address, VIP or DNS name.
  publicHost: ""
  # A virtual IP that follows a healthy instance (kube-vip, ARP mode), so
  # phones keep one address through the loss of either node. Needs
  # hostNetwork, at least two replicas on nodes of one layer-2 network (the
  # VIP is added to vip.interface there), and a free address on it.
  vip:
    enabled: false
    # The VIP (REQUIRED with enabled). The phones' sockets and the
    # Hello-facing socket bind it, and publicHost becomes it, so every address
    # a dialog names (Via, Path, Record-Route) survives an instance.
    address: ""
    # The network interface that carries the VIP on those nodes (REQUIRED
    # with enabled): eth0, bond0, ...
    interface: ""
    # Also serve each node's own address (an instance's pod IP) on separate
    # sockets, for phones provisioned with it before the VIP. They move at
    # their next fetch (docs/provisioning.md); drop this when none remain.
    legacy: false
    # kube-vip talks to the API server through the name "kubernetes". Set
    # this to the address that name resolves to on the edge nodes when it
    # must not be the cluster's service address, e.g. 127.0.0.1 on
    # control-plane nodes (as kube-vip's own DaemonSet does).
    apiServerAddress: ""
    image: ghcr.io/kube-vip/kube-vip:v1.2.3
    # The election Lease, in the release's namespace.
    leaseName: kamailio-vip
    leaseDurationSeconds: 5
    renewDeadlineSeconds: 3
    retryPeriodSeconds: 1
    # How long a stopping Kamailio keeps serving (and keeps its node's ports)
    # after the VIP container has released the Lease: the time the other
    # instance needs to take it, so the replacement pod cannot win it back
    # before Kamailio is up. Keep above retryPeriodSeconds x 2.2.
    handoffSeconds: 5
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 96Mi }
  # The port phones use, as advertised in Via and Record-Route.
  publicPort: 5060
  # The port Kamailio binds (UDP and TCP) on its pod address. With
  # hostNetwork it is the node port, so equals publicPort; behind a
  # NodePort or LoadBalancer it may differ.
  phonesPort: 5060
  metricsPort: 9090
  # Above sip.ringTimeout, in milliseconds.
  inviteTimeout: 45000
  # SIP over TLS for phones (phone-feature-parity S-14). Kamailio ends TLS
  # and speaks UDP to the hello-sip nodes. Needs a kamailio image with the
  # tls module (docker/kamailio) and a kubernetes.io/tls Secret issued by
  # the Hello CA whose names include publicHost (cert-manager on kw).
  tls:
    enabled: false
    # The port Kamailio binds on its pod address, and the port phones use.
    port: 5061
    publicPort: 5061
    nodePort: null
    secretName: ""
  # SIP over WSS for browsers (docs/webrtc.md; clients-webrtc-mobile-video
  # S-8 to S-12). Kamailio ends TLS and the WebSocket on its pod address and
  # speaks UDP to the hello-sip nodes (mutual TLS with helloTLS on). Needs a kamailio image with the
  # websocket and tls modules (docker/kamailio) and a certificate Secret.
  wss:
    enabled: false
    # The port Kamailio binds on its pod address (with hostNetwork, the node
    # port). Only the ingress controller should reach it (docs/webrtc.md).
    port: 8088
    # A kubernetes.io/tls Secret issued by the Hello CA; default
    # kamailio.tls.secretName. The ingress does not verify it.
    secretName: ""
    # Browser origins allowed to open a WebSocket, exact. Default: the origin
    # of global.publicUrl.
    origins: []
    # A regular expression the ingress controller's pod address must match
    # for its X-Forwarded-For to be believed (the browser's own address for
    # Hello's throttles). Empty: the ingress's address stands for every
    # browser.
    trustedProxies: ""
    # Publish wss://<ui.ingress.host>/sip through ui.ingress (needs
    # ui.ingress.enabled).
    ingress: true
    ingressAnnotations: {}
  # The TLS hop to Hello for encrypted phone legs (tls, ws, wss;
  # clients-webrtc-mobile-video S-12): those requests go to hello-sip over
  # mutual TLS and Hello's requests for them return to a TLS socket of the
  # instance on port. Needs sip.tls.enabled, a certificate Secret
  # (kamailio.tls.secretName, with its ca.crt, whose names include the
  # address Hello dials: every Kamailio node address) and an image with the
  # tls module. Off: kamailio.cfg behaves exactly as before.
  helloTLS:
    enabled: false
    port: 5073
    # hello-sip's TLS port (sip.tls.port).
    sipPort: 5061
  # Phones' Service when hostNetwork is off.
  service:
    type: LoadBalancer
    # Local keeps the phone's source address (no SNAT) and the node that
    # holds the pod answers.
    externalTrafficPolicy: Local
    nodePort: null
    loadBalancerIP: ""
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Browser softphone (docs/webrtc.md). The credentials are derived from keys in
# the credentials Secret (clientAuthKey, optionally clientAuthKeyPrevious while
# a key is being replaced); without clientAuthKey web devices are off.
clients:
  # Web devices one user may have (HELLO_CLIENT_MAX_DEVICES).
  maxDevices: 5
  # Where the softphone registers (HELLO_WSS_URL): the edge's WSS address.
  wssUrl: ""

# coturn: STUN and TURN for WebRTC media (docs/webrtc.md). One Deployment per
# server address; the shared secret (turnSecret in the credentials Secret) is
# the TURN REST API static-auth-secret, and hello-control derives the
# short-lived credentials the softphone gets from it.
coturn:
  enabled: false
  image:
    name: coturn
    tag: ""
  # hostNetwork binds the TURN and relay ports on the node address, so
  # relayed media leaves from the address clients are told (externalIP of the
  # server, which must be that node's address). Pin each server to its node
  # with servers[].nodeSelector. Without it each server gets a Service that
  # owns externalIP and lists every relay port.
  hostNetwork: true
  # The realm (default global.sipDomain).
  realm: ""
  port: 3478
  tlsPort: 5349
  # Relay ports; 800 allocations by default. Without hostNetwork at most 200
  # ports (a Service lists each one).
  relayPortMin: 49152
  relayPortMax: 49999
  # One entry per address clients reach TURN at (REQUIRED):
  #   - name: 1                   a DNS label; the Deployment is <release>-coturn-<name>
  #     externalIP: 192.168.10.x  the server's IPv4 address
  #     nodeSelector: {}          pins it to its node (hostNetwork)
  servers: []
  # The hello-sip media addresses clients may relay to (REQUIRED): single
  # IPv4 addresses or a-b ranges. Every private, loopback and link-local range
  # is denied except these.
  allowedPeers: []
  userQuota: 12
  totalQuota: 1200
  # TURN over TLS: a kubernetes.io/tls Secret (cert-manager) whose names
  # include the server addresses.
  tls:
    enabled: false
    secretName: ""
  # The Prometheus exporter (port 9641); needs a coturn built with it.
  metrics:
    enabled: false
  service:
    type: LoadBalancer
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

ui:
  replicas: 1
  image:
    name: hello-ui
    tag: ""
  # nginx re-resolves hello-control at request time and applies no search
  # domains: the cluster DNS Service address (kubectl -n kube-system get svc kube-dns).
  dnsResolver: 10.96.0.10
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  ingress:
    enabled: false
    className: nginx
    host: ""
    tlsSecretName: ""
    annotations:
      # Firmware uploads go up to 512 MB.
      nginx.ingress.kubernetes.io/proxy-body-size: "520m"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  nodeSelector: {}
  tolerations: []

# The fax engine (docs/fax.md): a separate deployment with spandsp and
# poppler, reachable only inside the cluster. Off by default; on, hello-sip and
# hello-control are told where it is (HELLO_FAX_ENABLED, HELLO_FAX_ADDR).
fax:
  enabled: false
  replicas: 1
  image:
    name: hello-fax
    tag: ""
  # The UDP range a fax session's media port is drawn from, on the pod.
  rtpPortMin: 40000
  rtpPortMax: 40999
  # A Secret holding the key faxToken: the bearer token between hello-sip,
  # hello-control and hello-fax. Empty: no token (rely on a network policy).
  tokenSecret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# Bundled single-instance state services, for evaluation only. Production
# points at highly available external services (valkey.external, minio.external,
# and the dsn in the credentials Secret).
postgresql:
  enabled: false
  image: postgres:18-alpine
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

valkey:
  enabled: false
  image: valkey/valkey:9-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }
  external:
    # host:port of one Valkey ...
    addr: ""
    # ... or Sentinels (host:port each) and the master set name.
    sentinels: []
    master: ""

minio:
  enabled: false
  # The upstream minio/minio image is no longer served from Docker Hub and is
  # private on quay.io, so the evaluation default is the frozen Bitnami legacy
  # image this project's CI also uses. It starts its server itself (no args),
  # keeps data under /bitnami/minio/data and runs as uid 1001. Production
  # points external.endpoint at a real S3 service instead. Pinned: this tag
  # is the image "latest" pointed at when CI first ran the chart (Docker Hub
  # digest sha256:451fe685...); "latest" itself could move under an install.
  image: bitnamilegacy/minio:2025.5.24-debian-12-r5
  args: []
  dataPath: /bitnami/minio/data
  fsGroup: 1001
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  external:
    endpoint: ""
    secure: true

podDisruptionBudget:
  enabled: true
