{{- $full := include "hello.fullname" . -}}
{{- $ctx := dict "root" . "component" "edge" -}}
{{- $k := .Values.kamailio -}}
{{- $publicHost := include "hello.kamailioPublicHost" . -}}
{{- $vip := $k.vip -}}
{{- $pair := gt (int $k.replicas) 1 -}}
{{- $list := include "hello.dispatcherList" . -}}
{{- if le (int .Values.sip.nodes) 0 }}{{ fail "sip.nodes must be at least 1" }}{{ end }}
{{- if lt (int $k.replicas) 1 }}{{ fail "kamailio.replicas must be at least 1" }}{{ end }}
{{- if $vip.enabled }}
{{- if not $k.hostNetwork }}{{ fail "kamailio.vip.enabled needs kamailio.hostNetwork: the VIP is added to the node's own interface" }}{{ end }}
{{- if not $pair }}{{ fail "kamailio.vip.enabled needs kamailio.replicas of at least 2: the VIP exists to follow a healthy instance" }}{{ end }}
{{- if not $vip.interface }}{{ fail "kamailio.vip.interface is required with kamailio.vip.enabled: the interface that carries the VIP on the edge nodes (eth0, bond0, ...)" }}{{ end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-kamailio
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
data:
  # A copy of deploy/kamailio/kamailio.cfg; a test keeps them equal.
  kamailio.cfg: |
    {{- .Files.Get "files/kamailio.cfg" | nindent 4 }}
  dispatcher.list: |
    {{- $list | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-kamailio
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $k.replicas }}
  {{- if $pair }}
  # One at a time, by construction. hostNetwork pods bind the node's ports, so
  # a surge pod could not start beside the one it replaces; maxSurge 0 takes
  # the old pod down first, and maxUnavailable 1 lets the controller touch the
  # second only once the first replacement is Ready (and has stayed so for
  # minReadySeconds). The required anti-affinity puts a replacement back on
  # its own node.
  minReadySeconds: {{ $k.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- else }}
  # The new pod binds the same ports as the old one under hostNetwork, and
  # two Kamailios must not answer one phone population at once: the old one
  # goes first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "hello.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello.selectorLabels" $ctx | nindent 8 }}
      annotations:
        # sha256 of kamailio.cfg followed by dispatcher.list. Kamailio reads
        # its configuration only at startup, so a change rolls the pod.
        hello.watteel.com/kamailio-config-sha256: {{ print (.Files.Get "files/kamailio.cfg") $list | sha256sum }}
        {{- with $k.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $vip.enabled }}
      # kube-vip's own identity (a Lease in this namespace and nothing else);
      # its token is projected into the vip container alone.
      serviceAccountName: {{ $full }}-kamailio-vip
      {{- else }}
      serviceAccountName: {{ $full }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if and $vip.enabled $vip.apiServerAddress }}
      hostAliases:
        - ip: {{ $vip.apiServerAddress | quote }}
          hostnames:
            - kubernetes
      {{- end }}
      {{- include "hello.pullSecrets" . | nindent 6 }}
      {{- if $k.hostNetwork }}
      # Phones must reach Kamailio with no NAT in between: through a NodePort
      # the CNI may SNAT them, Kamailio records the translated address as the
      # phone's, and later INVITEs to it are lost.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with $k.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $aff := deepCopy (default dict $k.affinity) }}
      {{- if and $pair $k.hostNetwork }}
      {{- /* One per node: each binds its node's ports. Replaces any podAntiAffinity of kamailio.affinity. */}}
      {{- $_ := set $aff "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "labelSelector" (dict "matchLabels" (fromYaml (include "hello.selectorLabels" $ctx))) "topologyKey" "kubernetes.io/hostname"))) }}
      {{- end }}
      {{- if $aff }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}
      securityContext:
        # /run/kamailio is an emptyDir the kamailio user (102) must write its
        # ctl socket and RPC FIFO into.
        fsGroup: 102
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kamailio's dispatcher (ds_load_mode 1) resolves every destination
        # name at startup and exits if one does not resolve. During a rollout
        # a hello-sip pod name has no DNS record until the pod is ready;
        # without this wait Kamailio crash-loops until every node exists.
        # Bounded, logged, and then Kamailio starts regardless: a node that
        # stays gone still fails loudly there rather than silently running
        # without it.
        - name: wait-dispatcher
          image: {{ include "hello.image" (dict "root" . "name" $k.image.name "tag" $k.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsUser: 102
            runAsGroup: 102
            runAsNonRoot: true
            {{- include "hello.containerSecurity" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              limit=300
              start=$(date +%s)
              for h in $(sed -n 's/^[0-9][0-9]*[[:space:]][[:space:]]*sip:\([^:;>[:space:]]*\).*/\1/p' /etc/kamailio/dispatcher.list); do
                until getent hosts "$h" >/dev/null; do
                  if [ $(( $(date +%s) - start )) -ge "$limit" ]; then
                    echo "wait-dispatcher: $h still unresolved after ${limit}s, starting kamailio anyway"
                    exit 0
                  fi
                  echo "wait-dispatcher: waiting for $h"
                  sleep 2
                done
                echo "wait-dispatcher: $h resolves"
              done
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: kamailio
          image: {{ include "hello.image" (dict "root" . "name" $k.image.name "tag" $k.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsUser: 102
            runAsGroup: 102
            runAsNonRoot: true
            {{- include "hello.containerSecurity" . | nindent 12 }}
          env:
            - name: KAMAILIO_LISTEN_IP
              # The pod address: the "hello" socket (5070) carries it to the
              # hello-sip nodes, and the phones sockets bind it.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAMAILIO_PUBLIC_HOST
              value: {{ $publicHost | quote }}
            {{- if $vip.enabled }}
            - name: KAMAILIO_EDGE_VIP
              # The phones and hello sockets bind the VIP (ip_free_bind: a node
              # that does not hold it yet can bind it).
              value: {{ $vip.address | quote }}
            {{- if $vip.legacy }}
            - name: KAMAILIO_LEGACY_IP
              # This node's own address, served until the last phone has moved.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- end }}
            - name: KAMAILIO_PUBLIC_PORT
              value: {{ $k.publicPort | quote }}
            - name: KAMAILIO_PHONES_PORT
              value: {{ $k.phonesPort | quote }}
            - name: KAMAILIO_METRICS_PORT
              value: {{ $k.metricsPort | quote }}
            - name: KAMAILIO_INVITE_TIMEOUT
              value: {{ $k.inviteTimeout | quote }}
          ports:
            - name: phones
              containerPort: {{ $k.phonesPort }}
              protocol: UDP
            - name: phones-tcp
              containerPort: {{ $k.phonesPort }}
              protocol: TCP
            - name: hello
              containerPort: 5070
              protocol: UDP
            - name: metrics
              containerPort: {{ $k.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio
              readOnly: true
            - name: run
              mountPath: /run/kamailio
          resources:
            {{- toYaml $k.resources | nindent 12 }}
        {{- if $vip.enabled }}
        # kube-vip holds the VIP (ARP) on the node whose Kamailio is healthy:
        # every pod runs it, they elect one holder with a Lease, and the
        # liveness probe asks the Kamailio beside it, so a Kamailio that stops
        # answering makes kubelet restart this container, which releases the
        # VIP (SIGTERM drops the Lease and the address) for the other.
        - name: vip
          image: {{ $vip.image }}
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: address
              value: {{ $vip.address | quote }}
            - name: vip_interface
              value: {{ $vip.interface | quote }}
            - name: vip_subnet
              value: "32"
            - name: vip_cidr
              value: "32"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: {{ .Release.Namespace | quote }}
            - name: vip_namespace
              value: {{ .Release.Namespace | quote }}
            - name: svc_enable
              value: "false"
            - name: svc_election
              value: "false"
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: {{ $vip.leaseName | quote }}
            - name: vip_leaseduration
              value: {{ $vip.leaseDurationSeconds | quote }}
            - name: vip_renewdeadline
              value: {{ $vip.renewDeadlineSeconds | quote }}
            - name: vip_retryperiod
              value: {{ $vip.retryPeriodSeconds | quote }}
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ $k.metricsPort }}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $k.metricsPort }}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: vip-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml $vip.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $full }}-kamailio
            defaultMode: 420
        - name: run
          emptyDir: {}
        {{- if $vip.enabled }}
        - name: vip-api
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
---
# In-cluster only: metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-kamailio
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hello.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: metrics
      port: {{ $k.metricsPort }}
      protocol: TCP
      targetPort: metrics
{{- if $vip.enabled }}
---
# kube-vip's identity: it elects the VIP holder with one Lease in this
# namespace and needs nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-kamailio-vip
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-kamailio-vip
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-kamailio-vip
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-kamailio-vip
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-kamailio-vip
{{- end }}
{{- if not $k.hostNetwork }}
---
# The phones' entry point when Kamailio is not on the host network.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-kamailio-phones
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
  {{- with $k.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $k.service.type }}
  {{- if ne $k.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ $k.service.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq $k.service.type "LoadBalancer") $k.service.loadBalancerIP }}
  loadBalancerIP: {{ $k.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "hello.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: phones
      port: {{ $k.publicPort }}
      protocol: UDP
      targetPort: phones
      {{- if and $k.service.nodePort (ne $k.service.type "ClusterIP") }}
      nodePort: {{ $k.service.nodePort }}
      {{- end }}
    - name: phones-tcp
      port: {{ $k.publicPort }}
      protocol: TCP
      targetPort: phones-tcp
      {{- if and $k.service.nodePort (ne $k.service.type "ClusterIP") }}
      nodePort: {{ $k.service.nodePort }}
      {{- end }}
{{- end }}
