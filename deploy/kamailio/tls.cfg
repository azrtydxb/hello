# Kamailio tls module configuration (phone-feature-parity S-14). Read only
# when KAMAILIO_TLS_PORT is set (see kamailio.cfg).
#
# The server certificate is issued by the Hello CA (cert-manager's
# cluster-ca on kw, the lab CA in compose) and mounted at /etc/hello-tls,
# which phones already trust through the CA push of provisioning (P8433 and
# the other vendors' trusted-certificate keys). TLS 1.2 is the minimum and
# TLS 1.3 is used when the phone supports it ("TLSv1.2+").
#
# Phones are not asked for a certificate: they authenticate with SIP digest
# like on UDP, TLS protects the transport.
[server:default]
method = TLSv1.2+
certificate = /etc/hello-tls/tls.crt
private_key = /etc/hello-tls/tls.key
verify_certificate = no
require_certificate = no

# Connections Kamailio itself opens (it normally reuses the phone's own).
[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
