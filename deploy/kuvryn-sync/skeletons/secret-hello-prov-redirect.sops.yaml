# Skeleton (comment-only, no values): the vendor redirect-service
# credentials hello-control reads as optional env on kw (each key's
# variable is in its comment). It
# lives outside kw/ because Sync and render-private.py decrypt every
# *.sops.yaml there, and a comment-only file fails that.
#
# To supply it: copy it to ../kw/secret-hello-prov-redirect.sops.yaml,
# keep only the groups you have (each group is all keys or none), and
# encrypt it in place:
#
#   export SOPS_AGE_KEY_FILE="$HOME/.config/kuvryn-sync/age/kw-hello.agekey"
#   sops edit deploy/kuvryn-sync/kw/secret-hello-prov-redirect.sops.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: hello-prov-redirect
#   namespace: hello
#   annotations:
#     sync.kuvryn.io/prune: disabled
#   labels:
#     app.kubernetes.io/managed-by: kuvryn-sync
# type: Opaque
# stringData:
#   # Snom SRAPS (Hawk access key)
#   snomSrapsAccessKeyId: ""  # HELLO_PROV_SNOM_KEY_ID
#   snomSrapsAccessKeySecret: ""  # HELLO_PROV_SNOM_KEY_SECRET
#   # Yealink RPS (access key and secret)
#   yealinkRpsAccessKey: ""  # HELLO_PROV_YEALINK_KEY
#   yealinkRpsAccessSecret: ""  # HELLO_PROV_YEALINK_SECRET
#   # Yealink YMCS, used when set (OAuth2 client; region)
#   yealinkYmcsClientId: ""  # HELLO_PROV_YMCS_CLIENT_ID
#   yealinkYmcsClientSecret: ""  # HELLO_PROV_YMCS_CLIENT_SECRET
#   yealinkYmcsRegion: ""  # HELLO_PROV_YMCS_REGION
#   # Grandstream GDMS (OAuth2 client, account, region, site)
#   gdmsClientId: ""  # HELLO_PROV_GDMS_CLIENT_ID
#   gdmsClientSecret: ""  # HELLO_PROV_GDMS_CLIENT_SECRET
#   gdmsUsername: ""  # HELLO_PROV_GDMS_USERNAME
#   gdmsPassword: ""  # HELLO_PROV_GDMS_PASSWORD
#   gdmsRegion: ""  # HELLO_PROV_GDMS_REGION
#   gdmsSiteId: ""  # HELLO_PROV_GDMS_SITE_ID
#   # Live-test devices for TestRedirectLive (a real phone per vendor you
#   # own; the vendor services reject unknown MACs)
#   liveTestSnomMac: ""
#   liveTestYealinkMac: ""
#   liveTestYealinkSerial: ""
#   liveTestGdmsMac: ""
#   liveTestGdmsSerial: ""
