# PostgreSQL credentials, SOPS-encrypted with the hello namespace age key.
# KEYS BELOW ARE PLACEHOLDERS: this file is an empty skeleton until it is
# encrypted. Create it with:
#
#   export SOPS_AGE_KEY_FILE="$HOME/.config/kuvryn-sync/age/kw-hello.agekey"
#   sops edit --age <hello-namespace-age-recipient> secret-hello-store.sops.yaml
#
# replacing this comment with the manifest below (real values, then save):
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: hello-store
#     namespace: hello
#     annotations:
#         sync.kuvryn.io/prune: disabled
#     labels:
#         app.kubernetes.io/managed-by: kuvryn-sync
# type: Opaque
# data:            <- sops encrypts plaintext values under `data`/`stringData`;
#     username: <generated>        use plaintext keys while editing; sops
#     password: <generated>        encrypts the values itself (encrypted_regex
#     dsn: <generated>             ^(data|stringData|env)$, as in dhole's
#                                  kw/secret-nexus-push.sops.yaml).
#
# Values (never committed in plaintext):
#   username: hello
#   password: openssl rand -hex 24
#   dsn: postgres://hello:<password>@postgres:5432/hello?sslmode=disable
#
# Referenced by hello-control / hello-sip (HELLO_DATABASE_URL from `dsn`) and
# the postgres Deployment (POSTGRES_USER/POSTGRES_PASSWORD). Like dhole's
# nexus-push, the Nexus pull needs no imagePullSecret; no registry secret is
# used here.
