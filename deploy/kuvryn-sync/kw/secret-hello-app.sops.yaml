# Hello application secret key (HELLO_SECRET_KEY), SOPS-encrypted with the hello namespace age key.
# KEYS BELOW ARE PLACEHOLDERS: this file is an empty skeleton until it is
# encrypted. Create it with:
#
#   export SOPS_AGE_KEY_FILE="$HOME/.config/kuvryn-sync/age/kw-hello.agekey"
#   sops edit --age <hello-namespace-age-recipient> secret-secret-hello-app.sops.yaml
#
# replacing this comment with the manifest below (real values, then save):
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: hello-app
#     namespace: hello
#     annotations:
#         sync.kuvryn.io/prune: disabled
#     labels:
#         app.kubernetes.io/managed-by: kuvryn-sync
# type: Opaque
# data:            <- sops encrypts plaintext values under `data`/`stringData`;
#     secretKey: <generated>
#
# Values (never committed in plaintext):
#   secretKey: openssl rand -base64 32   (the lab's HELLO_SECRET_KEY format)
#
# Referenced by hello-control and hello-sip (HELLO_SECRET_KEY).
