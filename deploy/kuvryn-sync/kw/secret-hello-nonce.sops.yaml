# SIP nonce secret (HELLO_SIP_NONCE_SECRET), SOPS-encrypted with the hello namespace age key.
# KEYS BELOW ARE PLACEHOLDERS: this file is an empty skeleton until it is
# encrypted. Create it with:
#
#   export SOPS_AGE_KEY_FILE="$HOME/.config/kuvryn-sync/age/kw-hello.agekey"
#   sops edit --age <hello-namespace-age-recipient> secret-hello-nonce.sops.yaml
#
# replacing this comment with the manifest below (real values, then save):
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: hello-nonce
#     namespace: hello
#     annotations:
#         sync.kuvryn.io/prune: disabled
#     labels:
#         app.kubernetes.io/managed-by: kuvryn-sync
# type: Opaque
# data:            <- sops encrypts plaintext values under `data`/`stringData`;
#     nonceSecret: <generated>     use plaintext keys while editing; sops
#                                  encrypts the values itself
#                                  (encrypted_regex ^(data|stringData|env)$).
#
# Values (never committed in plaintext):
#   nonceSecret: openssl rand -hex 16
#
# Referenced by hello-sip-1/2 (HELLO_SIP_NONCE_SECRET).
