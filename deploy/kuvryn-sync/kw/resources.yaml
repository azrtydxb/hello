# Hello on kw: the desired state kuvryn-sync converges. Mirrors the
# docker-compose lab (deploy/docker-compose/compose.yaml) and follows the
# dhole deployment pattern (azrtydxb/dhole deploy/kuvryn-sync/kw).
#
# Images are pinned by sha- tag; every merge to main publishes
# 192.168.10.131:5000/azrtydxb/hello-<part>:sha-<short sha> (workflow:
# .github/workflows/ci.yaml). Replace the tags below with the tag of the
# commit you intend to run and let Sync converge; immutable sha256 digest
# pins come later.
#
# One-time kw facts below are confirmed against the cluster (first sync of
# 2026-10-04): HELLO_SIP_TRUSTED_PROXIES is kw's pod CIDR 10.42.0.0/16 (node
# podCIDRs), HELLO_DNS_RESOLVER is kube-dns 10.43.0.10, KAMAILIO_PUBLIC_HOST
# is node master-11 192.168.10.101, where the hostNetwork kamailio pod binds
# 30508 (udp+tcp) itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-kamailio
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: edge
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    sync.kuvryn.io/prune: disabled
data:
  # Verbatim copy of deploy/kamailio/kamailio.cfg, enforced by
  # test/deploy (TestKwKamailioConfigMatchesSource); kw-specific values come
  # from the #!trydefenv parameters, never text edits. The pod runs with
  # hostNetwork on master-11 and its env sets KAMAILIO_LISTEN_IP from
  # status.podIP (the node address 192.168.10.101), so the "hello" socket's
  # Path and Record-Route name it, and the phones sockets bind
  # KAMAILIO_PHONES_PORT 30508 there and advertise
  # KAMAILIO_PUBLIC_HOST:30508.
  kamailio.cfg: |
    #!KAMAILIO
    #
    # Hello SIP edge: Kamailio in front of the hello-sip nodes.
    #
    # Spec .procoder/specs/ha.md S-6/S-7, plan .procoder/plans/ha.md contract 7.
    # Phones send everything to this one address; Kamailio
    #   - load-balances initial requests over the READY hello-sip nodes
    #     (dispatcher set 1, OPTIONS-probed every 4s);
    #   - keeps an AOR's REGISTERs on one node (hash of the From user);
    #   - adds Path (with the phone's received address) to REGISTER, so any
    #     Hello node reaches any phone through Kamailio;
    #   - record-routes initial INVITEs in both directions;
    #   - tells Hello the phone's real source in X-Hello-Client;
    #   - rate-limits REGISTER and INVITE per source IP (pike).
    #
    # It holds no Hello secrets and keeps no call or registration state of its
    # own: the only state is the dispatcher view and an in-memory keep-alive
    # list of NATed phones (rebuilt from the next REGISTER after a restart; it is
    # never used for routing).
    #
    # Two kinds of peers, told apart by the socket a request arrives on (not by
    # source address):
    #   - Hello nodes: requests received on the "hello" socket (UDP 5070). Their
    #     requests go to phones (Route = the Path or Record-Route Kamailio put
    #     there, both of which name the hello socket).
    #   - Phones: requests received on the "phones" sockets (PHONES_PORT). Their
    #     requests only ever go to Hello nodes.
    # The source address cannot decide this: on kw the hello-sip pods run with
    # hostNetwork, so their datagrams reach Kamailio SNAT'd from a node address
    # that matches no dispatcher entry (those are Service names/ClusterIPs).
    #
    # Never log message bodies or Authorization/Proxy-Authorization headers:
    # the lab's TestNoSecretsInLogs fails on 'Authorization: Digest' or
    # 'response="' in any service log.

    ####### Environment (set by compose) #######

    # The address phones use to reach this Kamailio (VIP, DNS name or, in the
    # lab, the host's published port): the advertised address of the "phones"
    # socket, so it is what phones see in Via, Record-Route and keep-alives.
    #!trydefenv PUBLIC_HOST=KAMAILIO_PUBLIC_HOST
    #!trydefenv PUBLIC_PORT=KAMAILIO_PUBLIC_PORT
    #!ifndef PUBLIC_HOST
    #!define PUBLIC_HOST 127.0.0.1
    #!endif
    #!ifndef PUBLIC_PORT
    #!define PUBLIC_PORT 5080
    #!endif

    # Kamailio's own address on the edge network (its fixed IP; hello-sip's
    # HELLO_SIP_TRUSTED_PROXIES names it). It must be a real address: the
    # "hello" socket's Path and Record-Route carry it.
    #!trydefenv LISTEN_IP=KAMAILIO_LISTEN_IP
    #!ifndef LISTEN_IP
    #!define LISTEN_IP 10.89.53.10
    #!endif

    # The port the "phones" sockets (UDP and TCP) bind on LISTEN_IP, and the
    # metrics socket's TCP port. The lab keeps the defaults; on kw Kamailio runs
    # with hostNetwork on master-11 and binds the phones' port (30508) directly
    # on the node address, so phones reach it with no NAT in between and
    # Kamailio sees their real source address (a NodePort SNATs them), and the
    # metrics port moves off 9090 (taken on that node).
    #!trydefenv PHONES_PORT=KAMAILIO_PHONES_PORT
    #!ifndef PHONES_PORT
    #!define PHONES_PORT 5060
    #!endif
    #!trydefenv METRICS_PORT=KAMAILIO_METRICS_PORT
    #!ifndef METRICS_PORT
    #!define METRICS_PORT 9090
    #!endif

    # How long (ms) an INVITE towards Hello may stay unanswered after its first
    # provisional reply. Hello ends ringing itself (HELLO_SIP_RING_TIMEOUT,
    # default 30s), so this only matters when the node dies mid-ring: the
    # caller then gets 408 instead of hanging. Keep it above Hello's ring
    # timeout.
    #!trydefenv INVITE_TIMEOUT=KAMAILIO_INVITE_TIMEOUT
    #!ifndef INVITE_TIMEOUT
    #!define INVITE_TIMEOUT 45000
    #!endif

    # pike: requests allowed per source IP per 2s sampling unit before the IP is
    # blocked (blocking starts between 1x and 3x this for IPv4). Every phone in
    # the lab runs on the Docker host and so shares one source IP; the default
    # leaves room for the test suites. Size it per site in production.
    #!trydefenv PIKE_DENSITY=KAMAILIO_PIKE_DENSITY
    #!ifndef PIKE_DENSITY
    #!define PIKE_DENSITY 200
    #!endif

    ####### Flags #######

    # FLT_FROM_HELLO: the request came from a hello-sip node.
    # FLT_RETRIED: already failed over once (ds_next_dst).
    # FLB_NATB (branch): the phone is behind NAT (usrloc nat_bflag).
    # FLB_NATSIPPING (branch): send it SIP OPTIONS keep-alives.
    #!define FLT_FROM_HELLO 1
    #!define FLT_RETRIED 2
    #!define FLB_NATB 6
    #!define FLB_NATSIPPING 7

    # Dispatcher: set "1" is the hello-sip nodes; algorithm "7" hashes over
    # hash_pvar ($fU, the From user), "4" is round robin. Match mode "3" in
    # ds_is_from_list ignores port and protocol (used only to vet the target of
    # a phone's in-dialog request, route PHONE_IN_DIALOG).

    ####### Global parameters #######

    debug=2                 # info; never 3+ in production (it prints messages)
    log_stderror=yes        # the container logs to stdout/stderr
    memdbg=5
    memlog=5
    log_facility=LOG_LOCAL0
    log_prefix="{$mt $hdr(CSeq) $ci} "

    children=4
    auto_aliases=no
    server_header="Server: Hello edge"
    user_agent_header="User-Agent: Hello edge"
    sip_warning=0

    # Two SIP sockets, so each side sees an address it can reach:
    #   phones - UDP (and TCP) PHONES_PORT (5060), published to the host as UDP
    #            5080 in the lab and advertised as PUBLIC_HOST:PUBLIC_PORT.
    #            Phones send here.
    #   hello  - UDP 5070, internal to the edge network. Kamailio talks to the
    #            hello-sip nodes from here: dispatcher probes, Path, the
    #            Hello-facing Record-Route. Hello nodes send here.
    # TRUST ASSUMPTION: every request received on the hello socket is treated as
    # coming from a Hello node (request_route sets FLT_FROM_HELLO on it) and may
    # be relayed to any phone. So 5070 must stay internal: never published to
    # the host in compose, never exposed through a NodePort/LoadBalancer
    # Service on Kubernetes (on kw the hostNetwork pod binds it on the node
    # address, which only the Hello nodes are told about). Phones only ever
    # learn the advertised phones socket.
    # A request crossing from one socket to the other gets two Record-Route
    # headers (rr enable_double_rr), each naming the socket its side uses.
    listen=udp:LISTEN_IP:PHONES_PORT advertise PUBLIC_HOST:PUBLIC_PORT name "phones"
    listen=tcp:LISTEN_IP:PHONES_PORT advertise PUBLIC_HOST:PUBLIC_PORT name "phones_tcp"
    listen=udp:LISTEN_IP:5070 name "hello"
    # Prometheus metrics (xhttp_prom), internal only: not published to the host.
    # HTTP is served only here (event_route[xhttp:request] refuses it on the
    # phones TCP socket); SIP sent to it is dropped in request_route.
    listen=tcp:LISTEN_IP:METRICS_PORT name "metrics"
    tcp_accept_no_cl=yes

    # Answer quickly when a Hello node is gone: DNS failover and SRV are not
    # used (the dispatcher list holds the nodes' addresses), and the DNS blocklist would
    # hide a restarted node.
    dns_try_ipv6=no
    use_dns_failover=no
    use_dns_cache=on
    # No negative caching: a hello-sip node that comes back (a restarted
    # container, a rescheduled pod) must resolve at once, not stay "no such
    # host" for the default 60s - its in-dialog requests would be taken for a
    # dead node's and rerouted to a node that does not own the call. Only a
    # dead node's name is looked up again per request (route HELLO_NODE_NAME).
    dns_cache_negative_ttl=0
    dst_blocklist_init=off

    ####### Modules #######

    loadmodule "jsonrpcs.so"
    loadmodule "kex.so"
    loadmodule "corex.so"
    loadmodule "tm.so"
    loadmodule "tmx.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "pv.so"
    loadmodule "maxfwd.so"
    loadmodule "textops.so"
    loadmodule "siputils.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "ctl.so"
    loadmodule "cfg_rpc.so"
    loadmodule "dispatcher.so"
    loadmodule "path.so"
    loadmodule "usrloc.so"      # before nathelper, which pings its contacts
    loadmodule "registrar.so"
    loadmodule "nathelper.so"
    loadmodule "pike.so"
    loadmodule "xhttp.so"
    loadmodule "xhttp_prom.so"
    loadmodule "rtimer.so"

    # ctl: kamcmd's default socket (/run/kamailio/kamailio_ctl), so
    # `docker compose exec kamailio kamcmd dispatcher.list` works as the
    # kamailio user the container runs as.

    # jsonrpcs: RPC over the FIFO only (no HTTP transport here).
    modparam("jsonrpcs", "transport", 1)
    modparam("jsonrpcs", "fifo_name", "/run/kamailio/kamailio_rpc.fifo")

    # tm: 1.5s for a non-INVITE (and an INVITE's first reply) towards Hello and
    # for the dispatcher's OPTIONS probes, so a dead node is noticed quickly;
    # INVITEs towards Hello get INVITE_TIMEOUT and requests towards phones
    # longer timers (routes TO_HELLO, TO_PHONE).
    modparam("tm", "fr_timer", 1500)
    modparam("tm", "fr_inv_timer", 120000)
    modparam("tm", "reparse_invite", 1)

    # rr: double Record-Route (phone-facing public address, Hello-facing edge
    # address), and Route processing for both at once (r2=on).
    modparam("rr", "enable_full_lr", 0)
    modparam("rr", "append_fromtag", 0)

    # dispatcher (contract 7): set 1 = every hello-sip node.
    modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
    modparam("dispatcher", "ds_ping_method", "OPTIONS")
    modparam("dispatcher", "ds_ping_from", "sip:kamailio@hello.edge")
    # Probe every 4s: a dead or draining node is marked inactive within 15s at
    # worst (3 failed probes x 4s + the 1.5s fr_timer of the last probe = 13.5s,
    # below the 15s the HA spec allows before new work avoids it).
    modparam("dispatcher", "ds_ping_interval", 4)       # probe every 4s
    modparam("dispatcher", "ds_probing_mode", 1)        # probe every destination
    modparam("dispatcher", "ds_probing_threshold", 3)   # 3 failures: inactive
    modparam("dispatcher", "ds_inactive_threshold", 1)  # one 200: active again
    modparam("dispatcher", "ds_ping_reply_codes", "")   # only 200 is a success
    modparam("dispatcher", "hash_pvar", "$fU")          # REGISTER: From user
    modparam("dispatcher", "flags", 2)                  # keep failover list
    modparam("dispatcher", "xavp_dst", "_dsdst_")
    modparam("dispatcher", "xavp_ctx", "_dsctx_")
    modparam("dispatcher", "ds_load_mode", 1)           # a bad entry is fatal
    modparam("dispatcher", "ds_default_sockname", "hello") # probes from 5070
    # Re-resolve destination names in place (kw: hello-sip-N.hello.svc names
    # of headless Services; a hostNetwork pod that returns on another node has a
    # new IP). ds_dns_mode 1|4: resolve at load and again every ds_dns_interval
    # seconds, updating each destination's stored address without a reload, so
    # its probing state (active/inactive) is kept - a periodic ds_reload()
    # would rebuild the list and could mark a dead node active again until
    # three probes fail. The stored address is what ds_is_from_list compares
    # (the 403 non-Hello-target check in PHONE_IN_DIALOG). Lookups go through
    # the core DNS cache, which keeps each answer for its record's TTL (kw's
    # cluster DNS: 5s), so a moved pod's new address is seen within seconds.
    # A failed refresh keeps the last address. A name that no longer resolves
    # at all (a dead node's) is still recognised as a Hello node by name
    # (route HELLO_NODE_NAME) and its in-dialog requests rerouted. The lab's
    # list holds IP addresses, which resolve to themselves.
    modparam("dispatcher", "ds_dns_mode", 5)
    modparam("dispatcher", "ds_dns_interval", 5)
    # A Hello OPTIONS answer of 503 (draining, unhealthy) or none counts as a
    # failure; nothing else is accepted.

    # path: Path: <sip:LISTEN_IP:5070;lr;received=sip:phone-ip:port>; a request
    # routed by that Path (Route) goes to the received address.
    modparam("path", "use_received", 1)

    # nathelper: keep-alive OPTIONS to NATed phones. The keep-alive list is an
    # in-memory usrloc fed from 200 OK replies to REGISTER (route
    # REGISTER_REPLY); Kamailio never routes from it.
    modparam("nathelper", "natping_interval", 20)
    modparam("nathelper", "ping_nated_only", 1)
    modparam("nathelper", "sipping_bflag", FLB_NATSIPPING)
    modparam("nathelper", "sipping_from", "sip:keepalive@hello.edge")
    modparam("nathelper", "received_avp", "$avp(RECEIVED)")
    modparam("usrloc", "db_mode", 0)
    modparam("usrloc", "nat_bflag", FLB_NATB)
    modparam("registrar", "received_avp", "$avp(RECEIVED)")
    modparam("registrar", "max_contacts", 10)

    # pike: per source IP.
    modparam("pike", "sampling_time_unit", 2)
    modparam("pike", "reqs_density_per_unit", PIKE_DENSITY)
    modparam("pike", "remove_latency", 4)

    # xhttp_prom: GET http://<kamailio>:METRICS_PORT/metrics inside the network.
    modparam("xhttp", "url_skip", "^/(RPC|rpc)")
    modparam("xhttp_prom", "xhttp_prom_stats", "all")
    modparam("xhttp_prom", "prom_gauge", "name=dispatcher_set_destinations; label=setid")
    modparam("xhttp_prom", "prom_gauge", "name=dispatcher_set_active; label=setid")
    modparam("xhttp_prom", "prom_gauge", "name=dispatcher_destination_active; label=uri")
    modparam("xhttp_prom", "prom_counter", "name=dispatcher_transitions_total; label=uri:state")
    modparam("xhttp_prom", "prom_counter", "name=pike_blocked_total")

    # rtimer: refresh the dispatcher set gauges every 5s.
    modparam("rtimer", "timer", "name=dsmetrics;interval=5;mode=1;")
    modparam("rtimer", "exec", "timer=dsmetrics;route=DS_METRICS")

    ####### Routing #######

    request_route {
    	# The metrics socket is HTTP only: no SIP over it.
    	if ($Rp == METRICS_PORT) {
    		drop;
    	}

    	route(REQINIT);

    	if ($Rn == "hello") {
    		# Received on the Hello-facing socket (5070): a hello-sip node. See
    		# the trust assumption at the listen lines.
    		setflag(FLT_FROM_HELLO);
    	}

    	if (is_method("CANCEL")) {
    		if (t_check_trans()) {
    			route(RELAY);
    		}
    		exit;
    	}

    	if (is_method("ACK")) {
    		# An ACK for a negative reply belongs to its INVITE transaction: tm
    		# absorbs it here (the script ends). An ACK for a 2xx goes on.
    		t_check_trans();
    	} else {
    		# Absorb retransmissions of requests being processed.
    		if (t_precheck_trans()) {
    			t_check_trans();
    			exit;
    		}
    		t_check_trans();
    	}

    	if (isflagset(FLT_FROM_HELLO)) {
    		route(FROM_HELLO);
    	}
    	route(FROM_PHONE);
    }

    # Basic sanity, loop protection.
    route[REQINIT] {
    	if (!mf_process_maxfwd_header("10")) {
    		sl_send_reply("483", "Too Many Hops");
    		exit;
    	}
    	if (!sanity_check("17895", "7")) {
    		xlog("L_WARN", "malformed request from $si:$sp\n");
    		exit;
    	}
    }

    ####### Requests from phones (towards Hello) #######

    route[FROM_PHONE] {
    	# Only Kamailio says where a request came from.
    	remove_hf("X-Hello-Client");
    	force_rport();

    	if (is_method("REGISTER|INVITE") && !has_totag()) {
    		if (!pike_check_req()) {
    			if ($rc == -2) {
    				prom_counter_inc("pike_blocked_total", "1");
    				xlog("L_WARN", "pike: blocking $si (flooding $rm)\n");
    			}
    			exit; # dropped silently
    		}
    	}

    	# Keep-alive OPTIONS addressed to Kamailio itself.
    	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
    		sl_send_reply("200", "OK");
    		exit;
    	}

    	if (has_totag()) {
    		route(PHONE_IN_DIALOG);
    		exit;
    	}

    	# Initial request: Kamailio alone picks the Hello node, so any route a
    	# phone preloaded (an outbound proxy entry naming us) is dropped.
    	remove_hf("Route");

    	if (is_method("ACK")) {
    		# An ACK for a non-2xx reply is absorbed by tm (t_check_trans above);
    		# any other ACK without a To tag is stray.
    		exit;
    	}

    	if (is_method("REGISTER")) {
    		route(REGISTER);
    		exit;
    	}

    	if (is_method("INVITE|SUBSCRIBE|REFER")) {
    		# Dialog-forming: in-dialog requests from both sides cross Kamailio
    		# (two Record-Route headers: the hello socket, then the advertised
    		# phones socket).
    		$fsn = "hello";
    		record_route();
    		# Hello reaches the phone's NAT binding through ;alias=ip~port~udp on
    		# its Contact (handle_ruri_alias in route[FROM_HELLO]).
    		set_contact_alias();
    	}

    	if (!ds_select_dst("1", "4")) {
    		route(NO_NODE);
    	}
    	route(TO_HELLO);
    }

    # REGISTER: hash of the From user, so an AOR stays on one node while that
    # node is active, plus Path with the phone's received address.
    route[REGISTER] {
    	# Only our own Path reaches Hello: a phone could otherwise steer Hello's
    	# requests for its binding through a host of its choosing.
    	remove_hf("Path");
    	if (!add_path_received()) {
    		sl_send_reply("503", "Internal Path Error");
    		exit;
    	}
    	# Keep-alive list (route REGISTER_REPLY): record where the phone is.
    	if (nat_uac_test("19")) {
    		fix_nated_register();
    		setbflag(FLB_NATB);
    		setbflag(FLB_NATSIPPING);
    	}
    	t_on_reply("REGISTER_REPLY");
    	if (!ds_select_dst("1", "7")) {
    		route(NO_NODE);
    	}
    	route(TO_HELLO);
    }

    # In-dialog request from a phone: follow our Record-Route to the Hello node
    # that owns the dialog. Nothing else: a phone cannot use Kamailio to reach
    # any other host.
    route[PHONE_IN_DIALOG] {
    	if (!loose_route()) {
    		if (!is_method("ACK")) {
    			sl_send_reply("404", "Not Here");
    		}
    		exit;
    	}
    	# loose_route leaves the next hop in $du (another Route) or the R-URI
    	# (Hello's Contact, e.g. sip:hello-sip-1:5060). Hello writes its
    	# HELLO_SIP_ADVERTISED_ADDR there - an address (lab) or Service name
    	# (kw) resolving to the same IP as its dispatcher entry, even when the
    	# node runs with hostNetwork - so the target is checked against set 1.
    	if ($du != $null && $du != "") {
    		$var(next) = $du;
    	} else {
    		$var(next) = $ru;
    	}
    	if (is_method("INVITE|UPDATE")) {
    		set_contact_alias(); # a re-INVITE may move the phone
    	}
    	if (ds_is_from_list("1", "3", "$var(next)")) {
    		# A Hello node: its address matches a dispatcher destination. Sent
    		# there even when probed inactive (a draining node still owns its
    		# calls until it hands them over). In-call HA (Phase 7): if it is
    		# dead (408/503 or a branch timeout), the request is retried
    		# against another hello-sip node, which answers from the
    		# replicated dialog state.
    		t_on_failure("HELLO_IN_DIALOG");
    		route(TO_HELLO);
    	}
    	# No destination address matches: a dead Hello node (its name no
    	# longer resolves - a stopped container, a deleted pod's DNS record -
    	# or resolves to an address no destination has), or not a Hello node
    	# at all. Only membership by configured name tells them apart, never
    	# the resolved address, which is gone with the node.
    	route(HELLO_NODE_NAME);
    	if ($var(hello_node) != 1) {
    		xlog("L_WARN", "refused in-dialog $rm from $si:$sp to a non-Hello target\n");
    		sl_send_reply("403", "Forbidden");
    		exit;
    	}
    	# Spec S-3: an in-dialog request aimed at a dead Hello node goes to a
    	# surviving one, which answers from the replicated dialog state. The
    	# R-URI (the dead node's Contact) stays; only the next hop changes.
    	if (!ds_select_dst("1", "4")) {
    		route(NO_NODE);
    	}
    	xlog("L_INFO", "in-dialog $rm to dead Hello node $var(next): rerouted to $du\n");
    	t_on_failure("HELLO_FAILOVER");
    	route(TO_HELLO);
    }

    # Sets $var(hello_node) to 1 when $var(next)'s host is one of the
    # configured hello-sip names: a destination's duid (the node name its
    # Contact carries, e.g. hello-sip-1) or the host of its dispatcher URI. The
    # configured list is read from the dispatcher itself (dispatcher.list), so
    # a node whose DNS record is gone is still recognised by name. Hostname
    # characters only; a '.' in the host matches any character in the check,
    # which can only widen a match to another configured name.
    route[HELLO_NODE_NAME] {
    	$var(hello_node) = 0;
    	$var(host) = $(var(next){uri.host});
    	if (!($var(host) =~ "^[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*$")) {
    		return;
    	}
    	if (!jsonrpc_exec('{"jsonrpc": "2.0", "method": "dispatcher.list", "id": 1}')) {
    		return;
    	}
    	$var(re) = "\"(DUID\":[[:space:]]*\"|URI\":[[:space:]]*\"sip:)" + $var(host) + "[\":;]";
    	if ($jsonrpl(body) =~ $var(re)) {
    		$var(hello_node) = 1;
    	}
    }

    # Forward to the Hello node in $du with the client's address.
    route[TO_HELLO] {
    	$fsn = "hello";
    	# Hello answers at the source port of what we send it (rport), not at a
    	# Via port that a replaced pod or a NAT no longer owns (kw: stale
    	# conntrack on 5070 after a Kamailio pod replacement).
    	add_local_rport();
    	if (is_method("INVITE")) {
    		t_set_fr(INVITE_TIMEOUT, 1500);
    	}
    	# The phone's source after NAT fix-up (force_rport): the address Hello's
    	# failed-auth throttle, trunk source check and binding Source use.
    	if (af == INET6) {
    		append_hf("X-Hello-Client: [$si]:$sp\r\n");
    	} else {
    		append_hf("X-Hello-Client: $si:$sp\r\n");
    	}
    	if (!has_totag()) {
    		t_on_failure("HELLO_FAILOVER"); # initial requests only
    	}
    	route(RELAY);
    	exit;
    }

    route[NO_NODE] {
    	xlog("L_WARN", "no active hello-sip node for $rm\n");
    	append_to_reply("Retry-After: 5\r\n");
    	sl_send_reply("503", "No Hello Node Available");
    	exit;
    }

    ####### Requests from Hello (towards phones) #######

    route[FROM_HELLO] {
    	remove_hf("X-Hello-Client");

    	# Hello's own OPTIONS to Kamailio, if any.
    	if (is_method("OPTIONS") && uri == myself && $rU == $null && !is_present_hf("Route")) {
    		sl_send_reply("200", "OK");
    		exit;
    	}

    	# A Route naming us: the Path from REGISTER (path module sets $du from
    	# its received parameter) or our Record-Route in a dialog.
    	loose_route();

    	# A Contact with ;alias=ip~port~udp (set_contact_alias above): send to
    	# that address and strip the parameter.
    	if ($du == $null || $du == "") {
    		handle_ruri_alias();
    	}

    	if (is_method("INVITE|SUBSCRIBE|REFER") && !has_totag()) {
    		# In-dialog requests from both sides cross Kamailio: the phone's
    		# later requests (BYE, re-INVITE) come to the phones socket, Hello's
    		# to the hello socket.
    		route(PHONES_SOCKET);
    		record_route();
    	}
    	route(TO_PHONE);
    }

    # Send towards a phone from the phones socket of the phone's transport: TCP
    # when the destination (the Path's received, an alias or the R-URI) says so,
    # UDP otherwise.
    route[PHONES_SOCKET] {
    	if ($dP == "tcp") {
    		$fsn = "phones_tcp";
    	} else {
    		$fsn = "phones";
    	}
    }

    route[TO_PHONE] {
    	# Phones may be slow, far away and lossy: longer timers than towards
    	# Hello. A phone answers our Via's rport, i.e. the source port it saw.
    	t_set_fr(120000, 8000);
    	route(PHONES_SOCKET);
    	add_local_rport();
    	if (is_method("INVITE|SUBSCRIBE|REFER|UPDATE")) {
    		t_on_reply("PHONE_REPLY");
    	}
    	route(RELAY);
    	exit;
    }

    route[RELAY] {
    	if (!t_relay()) {
    		sl_reply_error();
    	}
    	exit;
    }

    ####### Replies and failures #######

    # A phone's reply to a dialog-forming request from Hello: alias its Contact
    # so in-dialog requests from Hello find the phone's NAT binding.
    onreply_route[PHONE_REPLY] {
    	if (status =~ "^(1[0-9][1-9]|2[0-9][0-9])$" && is_present_hf("Contact")) {
    		set_contact_alias();
    	}
    }

    # A 200 OK to a NATed phone's REGISTER: keep that phone in the keep-alive
    # list for as long as the binding Hello granted.
    onreply_route[REGISTER_REPLY] {
    	if (t_check_status("200") && isbflagset(FLB_NATSIPPING)) {
    		save("location", "0x01");
    	}
    }

    # In-call HA (Phase 7): an in-dialog request whose owning hello-sip node is
    # dead is retried against another node of the dispatcher set, skipping the
    # dead one. The taker answers from the replicated dialog state, so the
    # phone never sees the node change.
    failure_route[HELLO_IN_DIALOG] {
    	if (t_is_canceled()) {
    		exit;
    	}
    	if (isflagset(FLT_RETRIED)) {
    		exit;
    	}
    	if (!t_check_status("408|503") && !(t_branch_timeout() && !t_branch_replied())) {
    		exit;
    	}
    	# The dead hop as a string: assigning a null $du to a $var stores the
    	# integer 0, which no URI compares equal to.
    	if ($du != $null && $du != "") {
    		$var(dead) = $du;
    	} else {
    		$var(dead) = $ru;
    	}
    	if (!ds_select_dst("1", "4")) {
    		xlog("L_WARN", "in-dialog failover of $rm: no other hello-sip node\n");
    		exit;
    	}
    	if ($var(dead) == $du) {
    		if (!ds_next_dst()) {
    			xlog("L_WARN", "in-dialog failover of $rm: only the dead node is listed\n");
    			exit;
    		}
    	}
    	setflag(FLT_RETRIED);
    	xlog("L_INFO", "in-dialog failover of $rm: $var(dead) is dead, trying $du\n");
    	t_relay();
    	exit;
    }

    # Contract 7: a relay that times out or gets 503 is retried once on the next
    # active node; the phone gets the last answer otherwise.
    failure_route[HELLO_FAILOVER] {
    	if (t_is_canceled()) {
    		exit;
    	}
    	if (isflagset(FLT_RETRIED)) {
    		exit;
    	}
    	if (t_check_status("503") || (t_branch_timeout() && !t_branch_replied())) {
    		if (ds_next_dst()) {
    			setflag(FLT_RETRIED);
    			xlog("L_INFO", "failover of $rm to $du\n");
    			t_on_failure("HELLO_FAILOVER");
    			t_relay();
    			exit;
    		}
    	}
    }

    ####### Dispatcher events and metrics #######

    event_route[dispatcher:dst-down] {
    	xlog("L_WARN", "hello-sip destination down: $ru\n");
    	prom_gauge_set("dispatcher_destination_active", "0", "$ru");
    	prom_counter_inc("dispatcher_transitions_total", "1", "$ru", "down");
    }

    event_route[dispatcher:dst-up] {
    	xlog("L_WARN", "hello-sip destination up: $ru\n");
    	prom_gauge_set("dispatcher_destination_active", "1", "$ru");
    	prom_counter_inc("dispatcher_transitions_total", "1", "$ru", "up");
    }

    route[DS_METRICS] {
    	ds_dsg_fetch("1");
    	prom_gauge_set("dispatcher_set_destinations", "$dsg(count)", "1");
    	prom_gauge_set("dispatcher_set_active", "$dsg(active)", "1");
    }

    # HTTP is answered on the metrics socket only, never on the phones TCP one.
    event_route[xhttp:request] {
    	if ($Rp != METRICS_PORT) {
    		xhttp_reply("403", "Forbidden", "text/plain", "forbidden\n");
    		exit;
    	}
    	if (prom_check_uri()) {
    		prom_dispatch();
    		exit;
    	}
    	if ($hu == "/healthz") {
    		xhttp_reply("200", "OK", "text/plain", "ok\n");
    		exit;
    	}
    	xhttp_reply("404", "Not Found", "text/plain", "not found\n");
    }
  dispatcher.list: |
    # Hello SIP edge dispatcher destinations (lab twin:
    # deploy/kamailio/dispatcher.list). Format:
    #   setid destination flags priority attributes
    # Flags 0: start active; probing (ds_probing_mode 1) then keeps each
    # destination's state from its OPTIONS answers. The names are
    # re-resolved every 5s (ds_dns_mode in kamailio.cfg): a hostNetwork
    # hello-sip pod that returns on another node keeps its entry.
    1 sip:hello-sip-1.hello.svc.cluster.local:5060 0 0 duid=hello-sip-1
    1 sip:hello-sip-2.hello.svc.cluster.local:5060 0 0 duid=hello-sip-2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-sentinel
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: state
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    sync.kuvryn.io/prune: disabled
data:
  # Verbatim copy of deploy/valkey/sentinel.conf. Each sentinel-N pod copies
  # it to its writable /data on first start and appends
  # `sentinel announce-ip <its Service name>`, exactly as the compose
  # entrypoint does.
  sentinel.conf: |
    # Valkey Sentinel for the Hello lab (spec .procoder/specs/ha.md S-8, plan
    # contract 8). Each sentinel-N copies this template to /data/sentinel.conf on
    # first start only: Sentinel rewrites its config file with the current
    # primary and the peers it has learned, and a restart must keep that.
    port 26379
    dir /data

    # Identity: the template deliberately carries no `sentinel myid` line. Valkey
    # generates a distinct myid per container on first start and rewrites it into
    # /data/sentinel.conf, so the restart keeps it (verified: three containers,
    # three distinct myids). A myid shared by all three would make every Sentinel
    # read its peers' hello messages as its own and the mesh would never form.
    #
    # Docker gives containers new IPs when they are recreated, so every address
    # Sentinel stores, returns to clients (Hello) and announces to its peers is a
    # compose service name, resolvable on the "state" network. The per-container
    # `sentinel announce-ip <service name>` is appended to the copy by the
    # compose entrypoint, which is the only place that knows the name.
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

    # Master set "hello": valkey-1 is the primary at start; 2 of the 3 sentinels
    # must agree it is down before a failover. The down-after also ages peer
    # Sentinels and the replica into sdown, and a busy 2-vCPU runner can freeze a
    # Sentinel's event loop for seconds at a time (every freeze over ~2 s sends
    # it into a 30 s tilt that suspends the sdown checks entirely), so the
    # window must stay wider than a freeze: 3000 ms aged healthy peers into
    # sdown during CI freezes and left NOQUORUM, 5000 ms is the value
    # docs/ha.md recommends.
    sentinel monitor hello valkey-1 6379 2
    sentinel down-after-milliseconds hello 5000
    sentinel failover-timeout hello 10000
    sentinel parallel-syncs hello 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: edge
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: edge
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: edge
      annotations:
        # sha256 of the hello-kamailio ConfigMap's kamailio.cfg followed by
        # its dispatcher.list. Kamailio reads its config only at startup and
        # Sync does not restart pods on a ConfigMap change, so this rolls the
        # pod whenever the config changes. test/deploy enforces it.
        hello.watteel.com/kamailio-config-sha256: 043abb2bb19ed13eb14e0a8a06171a050c75ffffecada7f1ce84c784705c5667
    spec:
      # Phones must reach Kamailio with no NAT in between: through a NodePort
      # Cilium SNATs them, Kamailio records the SNAT mapping as the phone's
      # address and later INVITEs to it are lost. So the pod binds the node
      # address itself on the node phones are provisioned with.
      hostNetwork: true
      # Keep cluster DNS (the dispatcher's hello-sip-N Service names).
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master-11
      securityContext:
        # /run/kamailio is an emptyDir the kamailio user (102) must write its
        # ctl socket and RPC FIFO into; group ownership via fsGroup.
        fsGroup: 102
      containers:
        - name: kamailio
          # The official ghcr image is amd64-only and the kw nodes are
          # arm64; this is the Debian-trixie build from ci.yaml (docker/
          # kamailio/Dockerfile), pinned to the tag it published for
          # commit 1c3fe03 (the full sha tag; the registry keeps no short
          # tags). Later: an immutable repository@sha256:... digest.
          image: 192.168.10.131:5000/azrtydxb/kamailio:sha-d480140f037421847e964d32478c73ce60230f5e
          imagePullPolicy: IfNotPresent
          securityContext:
            # uid/gid of the image's kamailio user (read from the image).
            runAsUser: 102
            runAsGroup: 102
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: KAMAILIO_LISTEN_IP
              # The pod IP, i.e. master-11's address (hostNetwork): the
              # "hello" socket (5070) carries it to hello nodes, and the
              # phones sockets bind it at KAMAILIO_PHONES_PORT.
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAMAILIO_PUBLIC_HOST
              # Where phones reach this Kamailio: master-11's address, which
              # the pod binds directly (nodeSelector above).
              value: 192.168.10.101
            - name: KAMAILIO_PUBLIC_PORT
              value: "30508"
            - name: KAMAILIO_PHONES_PORT
              # Bound on the node, so the same as the advertised port.
              value: "30508"
            - name: KAMAILIO_METRICS_PORT
              # 9090 is taken on master-11 (truenas-csi-node).
              value: "9071"
            - name: KAMAILIO_INVITE_TIMEOUT
              # Above HELLO_SIP_RING_TIMEOUT (10s), as in the lab.
              value: "25000"
          ports:
            - name: phones
              containerPort: 30508
              protocol: UDP
            - name: phones-tcp
              containerPort: 30508
              protocol: TCP
            - name: hello
              containerPort: 5070
              protocol: UDP
            - name: metrics
              containerPort: 9071
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio
              readOnly: true
            - name: run
              # The ctl socket and RPC FIFO (/run/kamailio) must be writable
              # by the kamailio user.
              mountPath: /run/kamailio
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: hello-kamailio
            defaultMode: 420
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kamailio
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: edge
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  # In-cluster only (metrics). Phones reach the hostNetwork pod directly at
  # 192.168.10.101:30508; a NodePort would SNAT them (and hold the port).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: edge
  ports:
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-sip-1
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: sip
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: sip
      hello.dev/node: hello-sip-1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: sip
        hello.dev/node: hello-sip-1
    spec:
      # Anchored media needs a LAN-reachable RTP address: with the host
      # network the SIP listener and the relay's 20000-21000 legs bind the
      # node IP directly (see HELLO_MEDIA_ANCHOR_HOST below).
      hostNetwork: true
      # Keep cluster DNS on a host-networked pod (sentinels, MinIO, postgres).
      dnsPolicy: ClusterFirstWithHostNet
      # One hello-sip per node: the pods bind node UDP 5060 and TCP 8082,
      # so two on one node would fight over the ports.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - sip
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120 # a drain must finish (lab: 2h, capped here)
      containers:
        - name: hello-sip
          image: 192.168.10.131:5000/azrtydxb/hello-sip:sha-d480140f037421847e964d32478c73ce60230f5e
          # Pinned to the tag ci.yaml published for commit 1c3fe03 (the
          # full sha tag; the registry keeps no short tags). Later: an
          # immutable repository@sha256:... digest.
          imagePullPolicy: Always
          env:
            - name: HELLO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HELLO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: dsn
            - name: HELLO_VALKEY_SENTINELS
              value: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
            - name: HELLO_VALKEY_MASTER
              value: hello
            - name: HELLO_SIP_DOMAIN
              value: hello.kw.watteel.lab
            - name: HELLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-app
                  key: secretKey
            - name: HELLO_SIP_NONCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-nonce
                  key: nonceSecret
            - name: HELLO_SIP_RING_TIMEOUT
              value: 10s
            - name: HELLO_SIP_TRUSTED_PROXIES
              # The kamailio pod IPs. kw's pod CIDR, confirmed from the node
              # podCIDRs (10.42.0.0/16): hello ignores Path/X-Hello-Client
              # from anything else. The node CIDR 192.168.10.0/24 is here
              # because kw masquerades kamailio's relay traffic to host
              # -networked hello-sip pods when both sit on the same node, so
              # the relay's datagrams arrive from a node address too; trusting
              # both keeps the digest nonce bound to the stable phone address
              # (X-Hello-Client) whichever node answers a retried INVITE.
              value: 10.42.0.0/16,192.168.10.0/24
            - name: HELLO_SIP_ADVERTISED_ADDR
              # What hello tells Kamailio/phones this node is: its Service
              # name, resolvable in-cluster (dispatcher + dialog routes).
              value: hello-sip-1:5060
            - name: HELLO_DRAIN_TIMEOUT
              # Under the pod's 120s termination grace, so a drain finishes.
              value: 90s
            - name: MINIO_ENDPOINT
              # The voicemail object store (contract 6): the in-namespace
              # MinIO Deployment/Service, as in the lab's compose file.
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootPassword
            - name: MINIO_SECURE
              # In-cluster traffic to the Service, no TLS.
              value: "false"
            - name: HELLO_RTP_PORT_MIN
              # Phase 5 anchored media (spec .procoder/specs/media-anchoring.md):
              # relay legs bind UDP 20000-21000 on the host network, so the
              # range is reachable on the node IP (no Service maps a range).
              value: "20000"
            - name: HELLO_RTP_PORT_MAX
              value: "21000"
            - name: HELLO_MEDIA_ANCHOR_HOST
              # The IPv4 stamped into anchored SDP answers: this pod's node
              # IP via the Downward API, so it stays correct wherever the
              # pod schedules (no per-node hardcoding). LAN phones send
              # their RTP here; see docs/media.md, "Anchored media on kw".
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HELLO_MEDIA_FORCE_ANCHOR
              # The operator override stays off: anchor only when a feature
              # needs it (NAT detection, recording, announcement, voicemail).
              value: "false"
            - name: HELLO_MEDIA_RECORDING_NOTICE
              # The spoken notice plays before a recording starts.
              value: "true"
          ports:
            - name: http
              containerPort: 8082
            - name: sip
              containerPort: 5060
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
# No RTP Service here, and none is needed: the relay binds its UDP
# 20000-21000 legs on the host network, so anchored RTP lands on the node
# IP that HELLO_MEDIA_ANCHOR_HOST advertises in the SDP answers
# (docs/media.md). The Services stay only for the in-cluster paths:
# Kamailio's dispatcher set 1 and the dialog routes (Contact =
# HELLO_SIP_ADVERTISED_ADDR, the Service name).
#
# Headless (clusterIP: None): the name resolves straight to the pod's
# (host-network, so the node's) IP. Through a ClusterIP, Cilium's socket-LB
# translates Kamailio's sends on its listening UDP socket, and when the
# backend pod goes it force-terminates that socket
# (bpf-lb-sock-terminate-pod-connections): Kamailio got ECONNABORTED and
# exited, killing in-flight signalling, the moment a hello-sip pod was
# deleted. With no service IP there is nothing for socket-LB to translate
# or terminate. clusterIP is immutable: converting an existing Service
# means deleting it once and letting Sync recreate it.
apiVersion: v1
kind: Service
metadata:
  name: hello-sip-1
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: sip
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  type: ClusterIP
  clusterIP: None # headless: see the note above hello-sip-1
  selector:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: sip
    hello.dev/node: hello-sip-1
  ports:
    - name: sip
      port: 5060
      protocol: UDP
      targetPort: sip
    - name: http
      port: 8082
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-sip-2
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: sip
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: sip
      hello.dev/node: hello-sip-2
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: sip
        hello.dev/node: hello-sip-2
    spec:
      # The host network, DNS and anti-affinity reasoning is on the
      # hello-sip-1 pod spec above.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - sip
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
      containers:
        - name: hello-sip
          image: 192.168.10.131:5000/azrtydxb/hello-sip:sha-d480140f037421847e964d32478c73ce60230f5e
          # Pinned to the tag ci.yaml published for commit 1c3fe03 (the
          # full sha tag; the registry keeps no short tags). Later: an
          # immutable repository@sha256:... digest.
          imagePullPolicy: Always
          env:
            - name: HELLO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HELLO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: dsn
            - name: HELLO_VALKEY_SENTINELS
              value: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
            - name: HELLO_VALKEY_MASTER
              value: hello
            - name: HELLO_SIP_DOMAIN
              value: hello.kw.watteel.lab
            - name: HELLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-app
                  key: secretKey
            - name: HELLO_SIP_NONCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-nonce
                  key: nonceSecret
            - name: HELLO_SIP_RING_TIMEOUT
              value: 10s
            - name: HELLO_SIP_TRUSTED_PROXIES
              # The kamailio pod IPs. kw's pod CIDR, confirmed from the node
              # podCIDRs (10.42.0.0/16): hello ignores Path/X-Hello-Client
              # from anything else. The node CIDR 192.168.10.0/24 is here
              # because kw masquerades kamailio's relay traffic to host
              # -networked hello-sip pods when both sit on the same node, so
              # the relay's datagrams arrive from a node address too; trusting
              # both keeps the digest nonce bound to the stable phone address
              # (X-Hello-Client) whichever node answers a retried INVITE.
              value: 10.42.0.0/16,192.168.10.0/24
            - name: HELLO_SIP_ADVERTISED_ADDR
              # What hello tells Kamailio/phones this node is: its Service
              # name, resolvable in-cluster (dispatcher + dialog routes).
              value: hello-sip-2:5060
            - name: HELLO_DRAIN_TIMEOUT
              # Under the pod's 120s termination grace, so a drain finishes.
              value: 90s
            - name: MINIO_ENDPOINT
              # The voicemail object store (contract 6): the in-namespace
              # MinIO Deployment/Service, as in the lab's compose file.
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootPassword
            - name: MINIO_SECURE
              # In-cluster traffic to the Service, no TLS.
              value: "false"
            - name: HELLO_RTP_PORT_MIN
              # Phase 5 anchored media (spec .procoder/specs/media-anchoring.md):
              # relay legs bind UDP 20000-21000 on the host network, so the
              # range is reachable on the node IP (no Service maps a range).
              value: "20000"
            - name: HELLO_RTP_PORT_MAX
              value: "21000"
            - name: HELLO_MEDIA_ANCHOR_HOST
              # The IPv4 stamped into anchored SDP answers: this pod's node
              # IP via the Downward API, so it stays correct wherever the
              # pod schedules (no per-node hardcoding). LAN phones send
              # their RTP here; see docs/media.md, "Anchored media on kw".
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HELLO_MEDIA_FORCE_ANCHOR
              # The operator override stays off: anchor only when a feature
              # needs it (NAT detection, recording, announcement, voicemail).
              value: "false"
            - name: HELLO_MEDIA_RECORDING_NOTICE
              # The spoken notice plays before a recording starts.
              value: "true"
          ports:
            - name: http
              containerPort: 8082
            - name: sip
              containerPort: 5060
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
