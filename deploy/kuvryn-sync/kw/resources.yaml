# prov.hello.kw.watteel.lab: HTTPS for the per-device paths, and plain HTTP
# kept open (no ssl-redirect) only because the DHCP boot path and the CA
# download need it; hello-control refuses per-device paths over plain HTTP.
# Access logging is off because the token is in the path; Hello's fetch
# audit records it redacted. The certificate comes from cert-manager's
# ingress-shim off the cluster-issuer annotation (the novamem/nexora
# pattern): it writes hello-prov-tls, ca.crt included, which hello-control
# serves at /p/ca.crt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-prov
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: prov
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prov.hello.kw.watteel.lab
      secretName: hello-prov-tls
  rules:
    - host: prov.hello.kw.watteel.lab
      http:
        paths:
          - backend:
              service:
                name: hello-prov
                port:
                  number: 8083
            path: /p/
            pathType: Prefix
