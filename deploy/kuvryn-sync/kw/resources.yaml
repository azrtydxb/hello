apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-control
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: control
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: control
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: control
    spec:
      initContainers:
        - name: migrate
          # The lab runs `hello-control migrate up` as a one-shot (compose
          # hello-migrate); a Sync-managed Job would need RBAC the deployer
          # does not have, so it runs as an init container instead. The retry
          # loop absorbs PostgreSQL and the Sentinel quorum still coming up.
          image: ant.kw.watteel.lab/oci-hosted/azrtydxb/hello-control:sha-ff5a5d2dc68aefc2cdaaf4abbe30c7e44bf7cf98
          command:
            - sh
            - -c
            - >-
              until hello-control migrate up; do
              echo 'waiting for postgres/valkey'; sleep 3; done
          env:
            - name: HELLO_DATABASE_URL
