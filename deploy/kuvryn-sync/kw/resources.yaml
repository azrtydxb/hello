apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    # Firmware uploads go up to 512 MB; the controller's 1 MB default 413s.
    nginx.ingress.kubernetes.io/proxy-body-size: "520m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # The console, the API, the OAuth authorization server and /mcp over
    # TLS: cert-manager's ingress-shim issues hello-tls from cluster-ca
    # (the Sync deployer cannot create Certificate objects).
    cert-manager.io/cluster-issuer: cluster-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hello.kw.watteel.lab
      secretName: hello-tls
  rules:
    - host: hello.kw.watteel.lab
      http:
        paths:
          - backend:
              service:
                name: hello-ui
                port:
                  number: 8080
            path: /
            pathType: Prefix
