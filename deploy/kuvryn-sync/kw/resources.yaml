            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              # Sentinel rewrites its config (primary, peers, myid); the
              # template is copied here on first start only, so a restart
              # keeps the learned state — same as the lab's compose volume.
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: hello-sentinel
            defaultMode: 420
        - name: data
          emptyDir: {}
