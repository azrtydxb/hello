              # MinIO Deployment/Service, as in the lab's compose file.
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootPassword
            - name: MINIO_SECURE
              # In-cluster traffic to the Service, no TLS.
              value: "false"
      containers:
        - name: hello-control
          image: ant.kw.watteel.lab/oci-hosted/azrtydxb/hello-control:sha-ff5a5d2dc68aefc2cdaaf4abbe30c7e44bf7cf98
          # Pinned to the tag ci.yaml published for commit 1c3fe03 (the
          # full sha tag; the registry keeps no short tags). Later: an
          # immutable repository@sha256:... digest.
          imagePullPolicy: Always
          env:
            - name: HELLO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HELLO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: dsn
            - name: HELLO_VALKEY_SENTINELS
              value: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
            - name: HELLO_VALKEY_MASTER
              value: hello
            - name: HELLO_SIP_DOMAIN
              value: hello.kw.watteel.lab
            - name: HELLO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-app
                  key: secretKey
            - name: HELLO_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-bootstrap
                  key: password
            # In-product AI agent (docs/ai-agent.md): the local fastllm, private-only.
            # Secret hello-ai is optional; without it the agent stays off.
            - name: HELLO_AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: hello-ai
                  key: provider
                  optional: true
            - name: HELLO_AI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: hello-ai
                  key: base-url
                  optional: true
            - name: HELLO_AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: hello-ai
                  key: model
                  optional: true
            - name: HELLO_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-ai
                  key: api-key
                  optional: true
            - name: HELLO_AI_ALLOW_PUBLIC_ENDPOINT
              value: "false"
            # fastllm ignores tools whenever response_format is set, so the
            # answer's schema goes in the prompt instead (docs/ai-agent.md).
            - name: HELLO_AI_STRUCTURED_OUTPUT
              value: "prompt"
            - name: HELLO_AI_AIOPS_INTERVAL
              value: "120s"
            - name: HELLO_AI_EXPLAIN_MIN_INTERVAL
              value: "10m"
            - name: HELLO_AI_DAILY_TOKEN_BUDGET
              value: "2000000"
            - name: HELLO_AI_BACKGROUND_BUDGET_PERCENT
              value: "80"
            - name: HELLO_AI_MAX_CONCURRENCY
              value: "2"
            - name: HELLO_AI_TIMEOUT
              value: "180s"
            - name: MINIO_ENDPOINT
              # The voicemail object store (contract 6): the in-namespace
              # MinIO Deployment/Service, as in the lab's compose file.
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootPassword
            - name: MINIO_SECURE
              # In-cluster traffic to the Service, no TLS.
              value: "false"
            # External AI access (.procoder/specs/ai-external-access.md): the
            # OAuth authorization server and /mcp behind the hello Ingress,
            # which terminates TLS with hello-tls (docs/ai-access.md). MCP
            # clients register themselves (dynamic client registration).
            - name: HELLO_PUBLIC_URL
              value: https://hello.kw.watteel.lab
            - name: HELLO_OAUTH_DCR
              value: "true"
            # Phone provisioning (.procoder/specs/phone-auto-provisioning-service.md):
            # the listener on :8083 (HELLO_PROV_ADDR's default) behind the
            # hello-prov Ingress, which terminates TLS with hello-prov-tls.
            - name: HELLO_PROV_PUBLIC_URL
              value: https://prov.hello.kw.watteel.lab
            - name: HELLO_PROV_SIP_SERVER
              # Where provisioned phones register: Kamailio's VIP, as
              # KAMAILIO_PUBLIC_HOST/PORT advertise it. A phone moves to it
              # at its next fetch (Resync on the Phones page, or its
              # periodic re-check); until then it keeps working through
              # 192.168.10.101, which Kamailio still serves
              # (KAMAILIO_LEGACY_IP). docs/ha.md, "Moving phones to the VIP".
              value: 192.168.10.109:30508
            - name: HELLO_PROV_TRUSTED_PROXIES
              # kw's pod CIDR: ingress-nginx's X-Forwarded-Proto/-For are
              # believed from there only (HTTPS check, per-IP limits).
              value: 10.42.0.0/16
            - name: HELLO_PROV_CA_CERT
              # cluster-ca's certificate, from the hello-prov-tls secret
              # cert-manager writes; served at /p/ca.crt for phones to trust.
              value: /etc/hello/prov/ca.crt
            # Vendor redirect-service credentials (spec S-11) from the
            # hello-prov-redirect secret, every key optional: until the
            # secret exists the redirect clients stay unconfigured (see
            # ../README.md, Secrets).
            - name: HELLO_PROV_SNOM_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: snomSrapsAccessKeyId
                  optional: true
            - name: HELLO_PROV_SNOM_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: snomSrapsAccessKeySecret
                  optional: true
            - name: HELLO_PROV_YEALINK_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: yealinkRpsAccessKey
                  optional: true
            - name: HELLO_PROV_YEALINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: yealinkRpsAccessSecret
                  optional: true
            - name: HELLO_PROV_YMCS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: yealinkYmcsClientId
                  optional: true
            - name: HELLO_PROV_YMCS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: yealinkYmcsClientSecret
                  optional: true
            - name: HELLO_PROV_YMCS_REGION
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: yealinkYmcsRegion
                  optional: true
            - name: HELLO_PROV_GDMS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsClientId
                  optional: true
            - name: HELLO_PROV_GDMS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsClientSecret
                  optional: true
            - name: HELLO_PROV_GDMS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsUsername
                  optional: true
            - name: HELLO_PROV_GDMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsPassword
                  optional: true
            - name: HELLO_PROV_GDMS_REGION
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsRegion
                  optional: true
            - name: HELLO_PROV_GDMS_SITE_ID
              valueFrom:
                secretKeyRef:
                  name: hello-prov-redirect
                  key: gdmsSiteId
                  optional: true
          volumeMounts:
            - name: prov-ca
              mountPath: /etc/hello/prov
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
            - name: prov
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: prov-ca
          secret:
            secretName: hello-prov-tls
            items:
              - key: ca.crt
                path: ca.crt
