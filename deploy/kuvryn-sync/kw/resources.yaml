apiVersion: v1
kind: Service
metadata:
  name: hello-prov
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: prov
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: control
  ports:
    - name: prov
      port: 8083
      protocol: TCP
      targetPort: prov
---
# prov.hello.kw.watteel.lab: HTTPS for the per-device paths, and plain HTTP
# kept open (no ssl-redirect) only because the DHCP boot path and the CA
# download need it; hello-control refuses per-device paths over plain HTTP.
# Access logging is off because the token is in the path; Hello's fetch
# audit records it redacted. The certificate comes from cert-manager's
# ingress-shim off the cluster-issuer annotation (the novamem/nexora
# pattern): it writes hello-prov-tls, ca.crt included, which hello-control
# serves at /p/ca.crt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-prov
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: prov
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prov.hello.kw.watteel.lab
      secretName: hello-prov-tls
  rules:
    - host: prov.hello.kw.watteel.lab
      http:
        paths:
          - backend:
              service:
                name: hello-prov
                port:
                  number: 8083
            path: /p/
            pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-postgres
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: state
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    sync.kuvryn.io/prune: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: state
      hello.dev/part: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: state
        hello.dev/part: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hello
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U hello -d hello
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Lab parity (dhole's kw desired state also runs emptyDir): Sync does
        # not make this storage persistent; replacing the pod loses data.
        # Persistent storage is a separate, deliberate migration.
        - name: data
          emptyDir: {}
