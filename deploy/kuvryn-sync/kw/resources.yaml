apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-1
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: state
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    sync.kuvryn.io/prune: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: state
      hello.dev/part: sentinel-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: state
        hello.dev/part: sentinel-1
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: sentinel
          image: valkey/valkey:9-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            # The valkey image's valkey user, as in the lab's compose file.
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: SENTINEL_NAME
              value: sentinel-1
          command:
            - sh
            - -c
            - >-
              test -f /data/sentinel.conf || {
              cp /etc/valkey/sentinel.conf /data/sentinel.conf &&
              echo "sentinel announce-ip $SENTINEL_NAME" >> /data/sentinel.conf &&
              echo "sentinel announce-port 26379" >> /data/sentinel.conf; } &&
              exec valkey-sentinel /data/sentinel.conf
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                # ckquorum, not get-master: get-master answers from the
                # config alone and would be healthy even when this Sentinel
                # never joined the mesh (see deploy/valkey/sentinel.conf and
                # the lab's compose healthchecks).
                - valkey-cli -p 26379 sentinel ckquorum hello | grep -q ^OK
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              # Sentinel rewrites its config (primary, peers, myid); the
              # template is copied here on first start only, so a restart
              # keeps the learned state — same as the lab's compose volume.
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: hello-sentinel
            defaultMode: 420
        - name: data
          emptyDir: {}
---
