apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-postgres
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: state
    app.kubernetes.io/managed-by: kuvryn-sync
  annotations:
    sync.kuvryn.io/prune: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: state
      hello.dev/part: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: state
        hello.dev/part: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hello
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U hello -d hello
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Lab parity (dhole's kw desired state also runs emptyDir): Sync does
        # not make this storage persistent; replacing the pod loses data.
        # Persistent storage is a separate, deliberate migration.
        - name: data
          emptyDir: {}
