              # MinIO Deployment/Service, as in the lab's compose file.
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-store
                  key: minioRootPassword
            - name: MINIO_SECURE
              # In-cluster traffic to the Service, no TLS.
              value: "false"
      containers:
        - name: hello-control
          image: 192.168.10.131:5000/azrtydxb/hello-control:sha-d480140f037421847e964d32478c73ce60230f5e
          # Pinned to the tag ci.yaml published for commit 1c3fe03 (the
