# coturn: STUN and TURN for the browser softphone's WebRTC media
# (docs/webrtc.md, clients 3 and 4). Two servers, one per address clients reach
# TURN at, host-networked on master-11 (192.168.10.101) and master-12
# (192.168.10.102): UDP and TCP 3478, TLS 5349 and the relay range
# 49152-49999/UDP are bound on the node, so relayed media leaves from the
# address the client was told. The shared secret is the hello-coturn Secret
# (turnSecret, the TURN REST API static-auth-secret; sops); hello-control
# reads the same key (HELLO_TURN_SECRET) to derive the short-lived credentials
# the softphone gets. Rotating it needs a rolling restart of hello-control and
# both coturn pods together.
#
# TLS: hello-coturn-tls is issued by the Hello CA (cluster-ca) with the two
# node addresses as IP SANs, like hello-sip-tls.
#
# HOLD (see the PR): the image tag is the commit this file was written at; pin
# it to the tag ci.yaml published when the deploys resume.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-coturn-tls
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: coturn
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  secretName: hello-coturn-tls
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
  commonName: turn.hello.kw.watteel.lab
  dnsNames:
    - turn.hello.kw.watteel.lab
  ipAddresses:
    - 192.168.10.101
    - 192.168.10.102
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn-1
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: hello
    app.kubernetes.io/component: coturn-1
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  replicas: 1
  # One Deployment per address, never replicas behind one address: a TURN
  # allocation lives on one server and the relayed media must come back to
  # it. hostNetwork: the new pod binds the same node ports, so the old one
  # goes first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: hello
      app.kubernetes.io/component: coturn-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: hello
        app.kubernetes.io/component: coturn-1
    spec:
      # Relayed media must leave from the address clients are told about
      # (192.168.10.101, master-11).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master-11
      securityContext:
        runAsNonRoot: true
        runAsUser: 103
        runAsGroup: 103
        fsGroup: 103
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: ant.kw.watteel.lab/oci-hosted/azrtydxb/coturn:sha-2e6afd26e970e8f76d1f44f574e2d16322e5130b
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: hello-coturn
                  key: turnSecret
            - name: TURN_REALM
              value: hello.kw.watteel.lab
            - name: TURN_EXTERNAL_IP
              value: "192.168.10.101"
            - name: TURN_PORT
              value: "3478"
            - name: TURN_MIN_PORT
              value: "49152"
            - name: TURN_MAX_PORT
              value: "49999"
            - name: TURN_ALLOWED_PEERS
              # The hello-sip media addresses. hello-sip-1 and hello-sip-2 are
              # host-networked but not pinned to a node, so this is every node
              # that can run one (master-11 to master-13, worker-21 to
              # worker-25); every other private address stays denied.
              value: 192.168.10.101-192.168.10.108
            - name: TURN_USER_QUOTA
              value: "12"
            - name: TURN_TOTAL_QUOTA
              value: "1200"
            - name: TURN_TLS_PORT
              value: "5349"
            - name: TURN_TLS_CERT
              value: /etc/coturn/tls/tls.crt
            - name: TURN_TLS_KEY
              value: /etc/coturn/tls/tls.key
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns
              containerPort: 5349
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/coturn/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tls
          secret:
            secretName: hello-coturn-tls
            defaultMode: 288
---
