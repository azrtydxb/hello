# Extra values for the kw Arc runner scale set (release arc-azrtydxb,
# chart gha-runner-scale-set 0.14.2, namespace arc-runners).
#
# Why: on 2026-10-15 from 04:50 to 05:35 UTC codeload.github.com returned 404
# for the archive of actions/setup-go at its pinned v7.0.0 commit, and every
# job using it failed at "Set up job". The API tarball endpoint
# (api.github.com/repos/<owner>/<repo>/tarball/<sha>) kept serving it.
#
# How: an init container downloads each pinned action through the API
# endpoint into an emptyDir, laid out as the runner's action archive cache
# expects (<owner>_<repo>/<sha>.tar.gz). The runner reads that cache through
# ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE and falls back to its normal download
# for anything missing, so a stale list or a failed fetch only loses the
# cache, never the job.
#
# Keep ACTIONS in step with the SHAs pinned in .github/workflows. When
# Dependabot bumps an action, the new SHA is fetched the normal way until it
# is added here.
#
# Apply (merges with the release's current values):
#   helm get values arc-azrtydxb -n arc-runners -o yaml > current.yaml
#   helm upgrade arc-azrtydxb \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.14.2 -n arc-runners -f current.yaml -f action-cache-values.yaml
#
# The template below must repeat the release's existing containers, volumes
# and init containers (dind mode). Helm replaces lists rather than merging
# them, so compare with current.yaml before applying.
template:
  spec:
    initContainers:
      - name: action-cache
        image: curlimages/curl:8.11.1
        env:
          - name: ACTIONS
            value: >-
              actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
              actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
              docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
              golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        command: ["/bin/sh", "-c"]
        args:
          - |
            for a in $ACTIONS; do
              repo=${a%@*}; sha=${a#*@}
              dir=/cache/$(echo "$repo" | tr / _)
              mkdir -p "$dir"
              curl -fsSL --retry 3 -o "$dir/$sha.tar.gz" \
                "https://api.github.com/repos/$repo/tarball/$sha" \
                || { rm -f "$dir/$sha.tar.gz"; echo "skip $a"; }
            done
            exit 0
        volumeMounts:
          - name: action-cache
            mountPath: /cache
    containers:
      - name: runner
        env:
          - name: ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE
            value: /home/runner/action-archive-cache
        volumeMounts:
          - name: action-cache
            mountPath: /home/runner/action-archive-cache
            readOnly: true
    volumes:
      - name: action-cache
        emptyDir: {}
