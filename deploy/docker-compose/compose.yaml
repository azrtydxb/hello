# Hello development lab (spec §20, HA topology .procoder/specs/ha.md S-12):
# Kamailio in front of two SIP nodes, two control-plane replicas, the UI,
# PostgreSQL, and Valkey with a primary, a replica and three sentinels.
#   docker compose -f deploy/docker-compose/compose.yaml up -d --build --wait
# Phones use Kamailio on host UDP 5080; the SIP nodes' own host ports (5060,
# 5062) stay for direct-mode tests.
#
# Two networks (plan contract 8):
#   state - PostgreSQL, Valkey and Sentinel, and the Hello services that use
#           them. The partition test disconnects a SIP node from it.
#   edge  - everything phones and carriers talk to: Kamailio, the SIP nodes,
#           the control plane and UI, the simulated carriers. Fixed subnet,
#           so Kamailio and the SIP nodes have fixed addresses. Every host
#           port is published through it (gw_priority), so a node cut off
#           from "state" stays reachable.
name: hello

x-valkey-env: &valkey-env
  HELLO_VALKEY_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
  HELLO_VALKEY_MASTER: hello

# Lab-only credentials and secrets; never reuse outside this compose file.
x-db-env: &db-env
  <<: *valkey-env
  HELLO_DATABASE_URL: postgres://hello:hello@postgres:5432/hello?sslmode=disable
  HELLO_SIP_DOMAIN: hello.lab
  HELLO_SECRET_KEY: bGFiLW9ubHktc2VjcmV0LWtleS0wMTIzNDU2Nzg5YWI= # lab-only placeholder, confirmed 2026-10-02 gitleaks:allow

x-sip-env: &sip-env
  <<: *db-env
  HELLO_SIP_NONCE_SECRET: lab-only-nonce-secret-0123456789abcdef
  HELLO_SIP_RING_TIMEOUT: 10s
  # Kamailio's fixed edge address: only it may send Path and X-Hello-Client.
  HELLO_SIP_TRUSTED_PROXIES: 10.89.53.10/32

x-valkey-deps: &valkey-deps
  sentinel-1: { condition: service_healthy }
  sentinel-2: { condition: service_healthy }
  sentinel-3: { condition: service_healthy }

x-control: &control
  build: { context: ../.., target: hello-control }
  image: hello-control:dev
  depends_on:
    <<: *valkey-deps
    postgres: { condition: service_healthy }
    hello-migrate: { condition: service_completed_successfully }
  healthcheck: &readyz
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/readyz"]
    interval: 5s
    timeout: 3s
    retries: 12
  stop_grace_period: 40s
  networks:
    state: {}
    edge: { gw_priority: 1 }

x-sip: &sip
  build: { context: ../.., target: hello-sip }
  image: hello-sip:dev
  depends_on:
    <<: *valkey-deps
    hello-migrate: { condition: service_completed_successfully }
  healthcheck:
    <<: *readyz
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
  # Long enough for a test's drain to finish before Docker kills the node.
  stop_grace_period: 120s

x-valkey: &valkey
  image: valkey/valkey:9-alpine
  healthcheck:
    test: ["CMD", "valkey-cli", "ping"]
    interval: 2s
    retries: 30
  networks: [state]

x-sentinel: &sentinel
  image: valkey/valkey:9-alpine
  user: valkey
  depends_on:
    valkey-1: { condition: service_healthy }
    valkey-2: { condition: service_healthy }
  # Sentinel rewrites its config (current primary, known peers), so the
  # template is copied once into the container's writable /data and the
  # copy survives restarts; each sentinel announces its service name.
  entrypoint:
    - sh
    - -c
    - >-
      test -f /data/sentinel.conf || {
      cp /etc/valkey/sentinel.conf /data/sentinel.conf &&
      echo "sentinel announce-ip $$SENTINEL_NAME" >> /data/sentinel.conf; } &&
      exec valkey-sentinel /data/sentinel.conf
  volumes:
    - ../valkey/sentinel.conf:/etc/valkey/sentinel.conf:ro
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "valkey-cli -p 26379 sentinel get-master-addr-by-name hello | grep -q .",
      ]
    interval: 2s
    retries: 30
  networks: [state]

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: hello
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hello"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql]
    networks: [state]

  # Valkey: valkey-1 is the primary at start, valkey-2 its replica; Sentinel
  # moves the primary role on failure. Each announces its service name, so
  # Sentinel and Hello reach it by name whatever IP it gets.
  valkey-1:
    <<: *valkey
    command: ["valkey-server", "--replica-announce-ip", "valkey-1"]

  valkey-2:
    <<: *valkey
    command:
      [
        "valkey-server",
        "--replicaof",
        "valkey-1",
        "6379",
        "--replica-announce-ip",
        "valkey-2",
      ]
    depends_on:
      valkey-1: { condition: service_healthy }

  sentinel-1:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-1 }

  sentinel-2:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-2 }

  sentinel-3:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-3 }

  hello-migrate:
    <<: *control
    depends_on:
      postgres: { condition: service_healthy }
    command: ["migrate", "up"]
    healthcheck: { disable: true }
    environment:
      <<: *db-env
      HELLO_NODE_ID: hello-migrate
    networks: [state]

  hello-control-1:
    <<: *control
    environment:
      <<: *db-env
      HELLO_NODE_ID: hello-control-1
      HELLO_BOOTSTRAP_ADMIN_PASSWORD: hello-lab-admin
    ports: ["8081:8081"]

  hello-control-2:
    <<: *control
    environment: { <<: *db-env, HELLO_NODE_ID: hello-control-2 }

  hello-sip-1:
    <<: *sip
    environment:
      <<: *sip-env
      HELLO_NODE_ID: hello-sip-1
      # Phones outside Docker need an address they can reach, e.g. this
      # host's LAN IP: HELLO_SIP1_ADVERTISED=192.168.1.10:5060 (docs/phones.md).
      HELLO_SIP_ADVERTISED_ADDR: ${HELLO_SIP1_ADVERTISED:-hello-sip-1:5060}
      HELLO_DRAIN_TIMEOUT: ${HELLO_SIP1_DRAIN_TIMEOUT:-2h}
    ports: ["8082:8082", "5060:5060/udp"]
    networks:
      state: {}
      edge: { ipv4_address: 10.89.53.11, gw_priority: 1 }

  hello-sip-2:
    <<: *sip
    environment:
      <<: *sip-env
      HELLO_NODE_ID: hello-sip-2
      HELLO_SIP_ADVERTISED_ADDR: ${HELLO_SIP2_ADVERTISED:-hello-sip-2:5060}
      HELLO_DRAIN_TIMEOUT: ${HELLO_SIP2_DRAIN_TIMEOUT:-2h}
    ports: ["8083:8082", "5062:5060/udp"]
    networks:
      state: {}
      edge: { ipv4_address: 10.89.53.12, gw_priority: 1 }

  # The SIP edge (deploy/kamailio, plan contract 7). The official image is
  # published for amd64 only; Docker Desktop on Apple silicon emulates it.
  # It runs as the image's unprivileged kamailio user (its ports need no
  # root). Sockets: UDP 5060 for phones (host UDP 5080, advertised as
  # KAMAILIO_PUBLIC_HOST:PORT), UDP 5070 towards the hello-sip nodes, TCP
  # 9090 for /metrics (internal). Dispatcher state:
  #   docker compose exec kamailio kamcmd dispatcher.list
  # The dispatcher list holds the nodes' fixed edge IPs (10.89.53.11/.12),
  # not their names: see deploy/kamailio/dispatcher.list.
  # The image's entrypoint ignores extra arguments, so a config check needs
  # its own entrypoint:
  #   docker run --rm --entrypoint kamailio -v "$PWD/deploy/kamailio:/etc/kamailio:ro" \
  #     ghcr.io/kamailio/kamailio:6.0.8-bookworm -c -f /etc/kamailio/kamailio.cfg
  kamailio:
    image: ghcr.io/kamailio/kamailio:6.0.8-bookworm
    platform: linux/amd64
    user: kamailio
    environment:
      KAMAILIO_LISTEN_IP: 10.89.53.10
      # Where phones reach Kamailio (Record-Route facing phones). Phones on
      # another machine need this host's LAN IP here.
      KAMAILIO_PUBLIC_HOST: ${HELLO_KAMAILIO_PUBLIC_HOST:-127.0.0.1}
      KAMAILIO_PUBLIC_PORT: ${HELLO_KAMAILIO_PUBLIC_PORT:-5080}
      # Above the SIP nodes' HELLO_SIP_RING_TIMEOUT (10s here): a caller
      # whose node dies mid-ring gets 408 after this many ms.
      KAMAILIO_INVITE_TIMEOUT: "25000"
    volumes:
      - ../kamailio:/etc/kamailio:ro
    # started, not healthy: the edge must come up while a SIP node is down
    # and probe it inactive (dispatcher), not wait for it.
    depends_on:
      hello-sip-1: { condition: service_started }
      hello-sip-2: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://10.89.53.10:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["5080:5060/udp"]
    networks:
      edge: { ipv4_address: 10.89.53.10 }

  hello-ui:
    build: { context: ../../web }
    image: hello-ui:dev
    environment:
      HELLO_CONTROL_UPSTREAM: http://hello-control-1:8081
    depends_on:
      hello-control-1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      retries: 12
    ports: ["8080:8080"]
    networks: [edge]

  # Simulated carriers for trunk tests (test/fakecarrier; lab only).
  carrier-primary:
    build: { context: ../.., target: fakecarrier }
    image: hello-fakecarrier:dev
    environment:
      FAKE_NAME: carrier-primary
      FAKE_USER: hello-trunk
      FAKE_PASSWORD: lab-only-trunk-password # gitleaks:allow
      FAKE_REALM: carrier-primary.lab
      FAKE_INVITE_AUTH: "407"
      FAKE_CONTACT_HOST: carrier-primary
    ports: ["8091:8090"]
    networks: [edge]

  carrier-backup:
    build: { context: ../.., target: fakecarrier }
    image: hello-fakecarrier:dev
    environment:
      FAKE_NAME: carrier-backup
      FAKE_CONTACT_HOST: carrier-backup
    ports: ["8092:8090"]
    networks: [edge]

networks:
  state: {}
  edge:
    ipam:
      config:
        # Fixed addresses below .128; Docker assigns the rest dynamically.
        - subnet: 10.89.53.0/24
          ip_range: 10.89.53.128/25
          gateway: 10.89.53.1

volumes:
  pgdata:
