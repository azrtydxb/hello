# Hello development lab (spec §20, HA topology .procoder/specs/ha.md S-12):
# Kamailio in front of two SIP nodes, two control-plane replicas, the UI,
# PostgreSQL, and Valkey with a primary, a replica and three sentinels.
#   docker compose -f deploy/docker-compose/compose.yaml up -d --build --wait
# Phones use Kamailio on host UDP 5080; the SIP nodes' own host ports (5060,
# 5062) stay for direct-mode tests.
#
# Two networks (plan contract 8):
#   state - PostgreSQL, Valkey and Sentinel, and the Hello services that use
#           them. The partition test disconnects a SIP node from it.
#   edge  - everything phones and carriers talk to: Kamailio, the SIP nodes,
#           the control plane and UI, the simulated carriers. Fixed subnet,
#           so Kamailio and the SIP nodes have fixed addresses. Every host
#           port is published through it (gw_priority), so a node cut off
#           from "state" stays reachable.
name: hello

x-valkey-env: &valkey-env
  HELLO_VALKEY_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
  HELLO_VALKEY_MASTER: hello

# Lab-only credentials and secrets; never reuse outside this compose file.
x-db-env: &db-env
  <<: *valkey-env
  HELLO_DATABASE_URL: postgres://hello:hello@postgres:5432/hello?sslmode=disable
  HELLO_SIP_DOMAIN: hello.lab
  HELLO_SECRET_KEY: bGFiLW9ubHktc2VjcmV0LWtleS0wMTIzNDU2Nzg5YWI= # lab-only placeholder, confirmed 2026-10-02 gitleaks:allow
  # The voicemail object store (contract 6): required by both services'
  # configuration, so the lab runs its own MinIO on the state network.
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: hello-minio
  MINIO_SECRET_KEY: lab-only-minio-secret # gitleaks:allow
  MINIO_SECURE: "false"

x-sip-env: &sip-env
  <<: *db-env
  HELLO_SIP_NONCE_SECRET: lab-only-nonce-secret-0123456789abcdef
  HELLO_SIP_RING_TIMEOUT: 10s
  # Kamailio's fixed edge address: only it may send Path and X-Hello-Client.
  HELLO_SIP_TRUSTED_PROXIES: 10.89.53.10/32

x-valkey-deps: &valkey-deps
  sentinel-1: { condition: service_healthy }
  sentinel-2: { condition: service_healthy }
  sentinel-3: { condition: service_healthy }

# Phone provisioning (.procoder/specs/phone-auto-provisioning-service.md):
# the listener terminates TLS itself here (no ingress), with a lab CA and
# certificate the prov-certs one-shot generates. Phones on this host reach
# it at https://localhost:8443 (host 8083 is hello-sip-2's readyz); the
# rendered configs register through Kamailio on host UDP 5080.
x-prov-env: &prov-env
  HELLO_PROV_PUBLIC_URL: https://localhost:8443
  HELLO_PROV_SIP_SERVER: 127.0.0.1:5080
  HELLO_PROV_CA_CERT: /etc/hello/prov/ca.crt
  HELLO_PROV_TLS_CERT: /etc/hello/prov/tls.crt
  HELLO_PROV_TLS_KEY: /etc/hello/prov/tls.key

x-control: &control
  build: { context: ../.., target: hello-control }
  image: hello-control:dev
  depends_on: &control-deps
    <<: *valkey-deps
    postgres: { condition: service_healthy }
    hello-migrate: { condition: service_completed_successfully }
  healthcheck: &readyz
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/readyz"]
    interval: 5s
    timeout: 3s
    retries: 12
  stop_grace_period: 40s
  networks:
    state: {}
    edge: { gw_priority: 1 }

x-sip: &sip
  build: { context: ../.., target: hello-sip }
  image: hello-sip:dev
  depends_on:
    <<: *valkey-deps
    hello-migrate: { condition: service_completed_successfully }
  healthcheck:
    <<: *readyz
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
  # Long enough for a test's drain to finish before Docker kills the node.
  stop_grace_period: 120s

x-valkey: &valkey
  image: valkey/valkey:9-alpine
  healthcheck:
    test: ["CMD", "valkey-cli", "ping"]
    interval: 2s
    retries: 30
  networks: [state]

x-sentinel: &sentinel
  image: valkey/valkey:9-alpine
  user: valkey
  depends_on:
    valkey-1: { condition: service_healthy }
    valkey-2: { condition: service_healthy }
  # Sentinel rewrites its config (current primary, known peers, generated
  # myid), so the template is copied once into the container's writable /data
  # and the copy survives restarts. The template cannot know the service
  # name, so this entrypoint appends the per-container identity: peers must
  # ping this Sentinel by its resolvable service name and port, whatever
  # address Docker gave the container this boot.
  entrypoint:
    - sh
    - -c
    - >-
      test -f /data/sentinel.conf || {
      cp /etc/valkey/sentinel.conf /data/sentinel.conf &&
      echo "sentinel announce-ip $$SENTINEL_NAME" >> /data/sentinel.conf &&
      echo "sentinel announce-port 26379" >> /data/sentinel.conf; } &&
      exec valkey-sentinel /data/sentinel.conf
  volumes:
    - ../valkey/sentinel.conf:/etc/valkey/sentinel.conf:ro
  healthcheck:
    # ckquorum, not get-master: get-master answers from the config alone, so
    # it is healthy even when the Sentinel never connected to the primary or
    # learned no peers — exactly the silent state where a later primary loss
    # brings no sdown, no quorum and no promotion. ckquorum answers "OK n
    # usable Sentinels" only once this one monitors "hello" and gossips with
    # enough peers to reach the odown quorum and authorize a failover (the
    # 30x2s retries give a slow runner's Sentinel mesh time to form before
    # the lab is declared up; valkey-cli exits 0 for error replies, so the
    # grep, not the exit code, decides).
    test:
      ["CMD-SHELL", "valkey-cli -p 26379 sentinel ckquorum hello | grep -q ^OK"]
    interval: 2s
    retries: 30
  networks: [state]

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: hello
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hello"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql]
    networks: [state]

  # The voicemail audio store (contract 6). Health is the S3 liveness
  # endpoint: MinIO answers 200 only once it serves requests.
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: hello-minio
      MINIO_ROOT_PASSWORD: lab-only-minio-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [state]

  # Valkey: valkey-1 is the primary at start, valkey-2 its replica; Sentinel
  # moves the primary role on failure. Each announces its service name, so
  # Sentinel and Hello reach it by name whatever IP it gets.
  valkey-1:
    <<: *valkey
    command: ["valkey-server", "--replica-announce-ip", "valkey-1"]

  valkey-2:
    <<: *valkey
    command:
      [
        "valkey-server",
        "--replicaof",
        "valkey-1",
        "6379",
        "--replica-announce-ip",
        "valkey-2",
      ]
    depends_on:
      valkey-1: { condition: service_healthy }

  sentinel-1:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-1 }

  sentinel-2:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-2 }

  sentinel-3:
    <<: *sentinel
    environment: { SENTINEL_NAME: sentinel-3 }

  hello-migrate:
    <<: *control
    depends_on:
      postgres: { condition: service_healthy }
    command: ["migrate", "up"]
    healthcheck: { disable: true }
    environment:
      <<: *db-env
      HELLO_NODE_ID: hello-migrate
    networks: [state]

  # The provisioning CA and the listener's certificate (lab only; the CA
  # key is discarded once the certificate is signed). Generated once per
  # volume, so `down -v` starts a fresh CA. The tests read the CA with
  # `docker compose cp hello-control-1:/etc/hello/prov/ca.crt`.
  prov-certs:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /certs
        [ -s tls.crt ] && exit 0
        printf '%s\n' '[req]' 'distinguished_name=dn' 'prompt=no' '[dn]' 'CN=Hello lab provisioning CA' \
          '[ca]' 'basicConstraints=critical,CA:TRUE' 'keyUsage=critical,keyCertSign,cRLSign' 'subjectKeyIdentifier=hash' > ca.cnf
        printf '%s\n' '[req]' 'distinguished_name=dn' 'prompt=no' '[dn]' 'CN=localhost' \
          '[leaf]' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=serverAuth' \
          'subjectAltName=DNS:localhost,IP:127.0.0.1,DNS:hello-control-1,DNS:hello-control-2' > leaf.cnf
        openssl req -x509 -config ca.cnf -extensions ca -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 -keyout ca.key -out ca.crt
        openssl req -new -config leaf.cnf -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile leaf.cnf -extensions leaf -out tls.part
        mv tls.part tls.crt
        rm -f ca.key ca.srl tls.csr ca.cnf leaf.cnf
        chmod 0444 ca.crt tls.crt tls.key
    volumes: [provcerts:/certs]
    network_mode: none

  hello-control-1:
    <<: *control
    depends_on:
      <<: *control-deps
      prov-certs: { condition: service_completed_successfully }
    environment:
      <<: [*db-env, *prov-env]
      HELLO_NODE_ID: hello-control-1
      HELLO_BOOTSTRAP_ADMIN_PASSWORD: hello-lab-admin
    volumes: [provcerts:/etc/hello/prov:ro]
    ports: ["8081:8081", "8443:8083"]

  hello-control-2:
    <<: *control
    depends_on:
      <<: *control-deps
      prov-certs: { condition: service_completed_successfully }
    environment: { <<: [*db-env, *prov-env], HELLO_NODE_ID: hello-control-2 }
    volumes: [provcerts:/etc/hello/prov:ro]

  hello-sip-1:
    <<: *sip
    environment:
      <<: *sip-env
      HELLO_NODE_ID: hello-sip-1
      # Phones outside Docker need an address they can reach, e.g. this
      # host's LAN IP: HELLO_SIP1_ADVERTISED=192.168.1.10:5060 (docs/phones.md).
      HELLO_SIP_ADVERTISED_ADDR: ${HELLO_SIP1_ADVERTISED:-hello-sip-1:5060}
      HELLO_DRAIN_TIMEOUT: ${HELLO_SIP1_DRAIN_TIMEOUT:-2h}
    ports: ["8082:8082", "5060:5060/udp"]
    networks:
      state: {}
      edge: { ipv4_address: 10.89.53.11, gw_priority: 1 }

  hello-sip-2:
    <<: *sip
    environment:
      <<: *sip-env
      HELLO_NODE_ID: hello-sip-2
      HELLO_SIP_ADVERTISED_ADDR: ${HELLO_SIP2_ADVERTISED:-hello-sip-2:5060}
      HELLO_DRAIN_TIMEOUT: ${HELLO_SIP2_DRAIN_TIMEOUT:-2h}
    ports: ["8083:8082", "5062:5060/udp"]
    networks:
      state: {}
      edge: { ipv4_address: 10.89.53.12, gw_priority: 1 }

  # The SIP edge (deploy/kamailio, plan contract 7), built from
  # docker/kamailio (Debian trixie; the official image is amd64-only and
  # ghcr.io is not reachable from every network this lab runs on). It runs
  # as the image's unprivileged kamailio user (its ports need no root).
  # Sockets: UDP 5060 for phones (host UDP 5080, advertised as
  # KAMAILIO_PUBLIC_HOST:PORT), UDP 5070 towards the hello-sip nodes, TCP
  # 9090 for /metrics (internal). Dispatcher state:
  #   docker compose exec kamailio kamcmd dispatcher.list
  # The dispatcher list holds the nodes' fixed edge IPs (10.89.53.11/.12),
  # not their names: see deploy/kamailio/dispatcher.list.
  # The image's entrypoint ignores extra arguments, so a config check needs
  # its own entrypoint:
  #   docker run --rm --entrypoint kamailio -v "$PWD/deploy/kamailio:/etc/kamailio:ro" \
  #     hello-kamailio:dev -c -f /etc/kamailio/kamailio.cfg
  kamailio:
    build: { context: ../.., dockerfile: docker/kamailio/Dockerfile }
    image: hello-kamailio:dev
    user: kamailio
    environment:
      KAMAILIO_LISTEN_IP: 10.89.53.10
      # Where phones reach Kamailio (Record-Route facing phones). Phones on
      # another machine need this host's LAN IP here.
      KAMAILIO_PUBLIC_HOST: ${HELLO_KAMAILIO_PUBLIC_HOST:-127.0.0.1}
      KAMAILIO_PUBLIC_PORT: ${HELLO_KAMAILIO_PUBLIC_PORT:-5080}
      # Above the SIP nodes' HELLO_SIP_RING_TIMEOUT (10s here): a caller
      # whose node dies mid-ring gets 408 after this many ms.
      KAMAILIO_INVITE_TIMEOUT: "25000"
    volumes:
      - ../kamailio:/etc/kamailio:ro
    # started, not healthy: the edge must come up while a SIP node is down
    # and probe it inactive (dispatcher), not wait for it.
    depends_on:
      hello-sip-1: { condition: service_started }
      hello-sip-2: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://10.89.53.10:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["5080:5060/udp"]
    networks:
      edge: { ipv4_address: 10.89.53.10 }
    # The idle/edge services (kamailio, hello-ui, carrier-primary,
    # carrier-backup) get weight 256 against the default 1024 everywhere
    # else: that gives the stateful trio (postgres, valkey-1/2,
    # sentinel-1..3 — plus the Hello services that must react to them)
    # priority on 2-vCPU CI runners so Sentinel elections aren't starved
    # into tilt (TestValkeyFailover).
    cpu_shares: 256

  hello-ui:
    build: { context: ../../web }
    image: hello-ui:dev
    environment:
      HELLO_CONTROL_UPSTREAM: http://hello-control-1:8081
    depends_on:
      hello-control-1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      retries: 12
    ports: ["8080:8080"]
    networks: [edge]
    cpu_shares: 256 # see kamailio

  # Simulated carriers for trunk tests (test/fakecarrier; lab only).
  carrier-primary:
    build: { context: ../.., target: fakecarrier }
    image: hello-fakecarrier:dev
    environment:
      FAKE_NAME: carrier-primary
      FAKE_USER: hello-trunk
      FAKE_PASSWORD: lab-only-trunk-password # gitleaks:allow
      FAKE_REALM: carrier-primary.lab
      FAKE_INVITE_AUTH: "407"
      FAKE_CONTACT_HOST: carrier-primary
    ports: ["8091:8090"]
    networks: [edge]
    cpu_shares: 256 # see kamailio

  carrier-backup:
    build: { context: ../.., target: fakecarrier }
    image: hello-fakecarrier:dev
    environment:
      FAKE_NAME: carrier-backup
      FAKE_CONTACT_HOST: carrier-backup
    ports: ["8092:8090"]
    networks: [edge]
    cpu_shares: 256 # see kamailio

networks:
  state: {}
  edge:
    ipam:
      config:
        # Fixed addresses below .128; Docker assigns the rest dynamically.
        - subnet: 10.89.53.0/24
          ip_range: 10.89.53.128/25
          gateway: 10.89.53.1

volumes:
  pgdata:
  provcerts:
