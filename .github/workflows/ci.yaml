name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: [self-hosted, linux, x64] # kw Arc runner (labeled self-hosted/linux/x64); free GitHub runners are too small for the lab
    # The runner image has no Go toolchain; run in a container instead.
    container: golang:1.27
    timeout-minutes: 15
    env:
      HELLO_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      HELLO_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ARC runners have no service containers: start the test dependencies
      # as plain containers on the runner's own Docker (DinD).
      - name: Start PostgreSQL and Valkey
        run: |
          set -euo pipefail
          docker run -d --name ci-pg -e POSTGRES_PASSWORD=ci -p 5432:5432 postgres:18-alpine
          docker run -d --name ci-vk -p 6379:6379 valkey/valkey:9-alpine
          for _ in $(seq 1 60); do docker exec ci-pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec ci-pg pg_isready -U postgres
          for _ in $(seq 1 60); do docker exec ci-vk valkey-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          docker exec ci-vk valkey-cli ping
      # In container mode the workspace is mounted from the runner user's
      # home; Go's VCS stamping refuses a directory owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: go test -race ./...

      - name: Remove the test dependencies
        if: always()
        run: docker rm -f ci-pg ci-vk

  web:
    runs-on: [self-hosted, linux, x64] # kw Arc runner (labeled self-hosted/linux/x64); free GitHub runners are too small for the lab
    container: node:26-bookworm # the runner image has no Node toolchain
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g pnpm@10 # node:26 has no corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    runs-on: [self-hosted, linux, x64] # kw Arc runner (labeled self-hosted/linux/x64); free GitHub runners are too small for the lab
    timeout-minutes: 30
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner has the docker CLI but not the compose plugin; the lab
      # tests need `docker compose`.
      - name: Install the compose plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.2/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Non-root images and SIP flows against the two-node lab
        env:
          HELLO_DOCKER: "1"
        run: go test -count=1 -timeout 25m -v ./test/integration/
