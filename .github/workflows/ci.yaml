name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: [self-hosted, linux, x64] # the kw Arc runner (DinD); free GitHub runners are too small for the lab
    # The runner image has no Go toolchain; run in a container instead.
    container: golang:1.27
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-retries 30
    env:
      HELLO_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      HELLO_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: go test -race ./...

  web:
    runs-on: [self-hosted, linux, x64] # the kw Arc runner (DinD); free GitHub runners are too small for the lab
    container: node:26-bookworm # the runner image has no Node toolchain
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g pnpm@10 # node:26 has no corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    runs-on: [self-hosted, linux, x64] # the kw Arc runner (DinD); free GitHub runners are too small for the lab
    timeout-minutes: 30
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner has the docker CLI but not the compose plugin; the lab
      # tests need `docker compose`.
      - name: Install the compose plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.2/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Non-root images and SIP flows against the two-node lab
        env:
          HELLO_DOCKER: "1"
        run: go test -count=1 -timeout 25m -v ./test/integration/
