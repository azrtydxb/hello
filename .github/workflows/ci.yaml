# The shape mirrors kuvryn-scout: test jobs run in containers on the generic
# ARC runners, and what lands on main is built and pushed to Nexus by the
# publish runners. Kuvryn Sync then deploys those images (deploy/kuvryn-sync/).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: 192.168.10.131:5000

jobs:
  go:
    runs-on: arc-azrtydxb
    timeout-minutes: 30
    container:
      # The Go toolchain comes from the same base the Dockerfile builds
      # with, so CI and the image agree on the compiler.
      image: golang:1.27-bookworm
    env:
      # The database-backed tests read these; without them they skip and
      # say so, which would make a green run meaningless.
      HELLO_TEST_DATABASE_URL: postgres://hello:hello@postgres:5432/hello?sslmode=disable
      HELLO_TEST_VALKEY_ADDR: valkey:6379
      # The voicemail MinIO tests reuse this endpoint instead of starting
      # their own container; the user is the tests' fixed "hello".
      HELLO_TEST_MINIO_ENDPOINT: minio:9000
      HELLO_TEST_MINIO_PASS: hello-voicemail-secret
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hello
          POSTGRES_PASSWORD: hello
          POSTGRES_DB: hello
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: hello
          MINIO_ROOT_PASSWORD: hello-voicemail-secret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go refuses to stamp VCS info for a workspace owned by another uid.
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: go test -race ./...

  web:
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    container:
      image: node:26-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node:26 no longer bundles corepack, so pnpm comes from npm.
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  lab:
    # The Phase 3 failure-injection and lab flow tests drive the real compose
    # lab (deploy/docker-compose), so they need the runner's Docker daemon,
    # the compose plugin and a Go toolchain on the runner itself — not a job
    # container. The go job must be green first: the lab builds the same
    # images from the same source.
    needs: [go]
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Evidence first: what the runner actually has decides whether this
      # job can work here at all.
      - name: Docker and compose on the runner
        run: |
          docker version
          docker compose version || {
            echo "compose plugin missing; installing"
            arch=$(uname -m); case $arch in
              x86_64) carch=x86_64 ;;
              aarch64|arm64) carch=aarch64 ;;
              *) echo "unsupported arch $arch"; exit 1 ;;
            esac
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.40.2/docker-compose-linux-$carch" \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lab and failure-injection tests
        env:
          HELLO_DOCKER: "1"
        run: go test -count=1 -timeout 50m -v ./test/integration/

  publish:
    # Only what lands on main becomes an image; a pull request is tested and
    # nothing more.
    if: github.event_name != 'pull_request'
    needs: [go, web]
    runs-on: arc-azrtydxb-publish
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        image:
          - {
              name: hello-control,
              context: .,
              file: Dockerfile,
              target: hello-control,
            }
          - { name: hello-sip, context: ., file: Dockerfile, target: hello-sip }
          - { name: hello-ui, context: web, file: web/Dockerfile, target: "" }
          # The official kamailio image is amd64-only; the kw nodes are
          # arm64, so the edge image builds from Debian trixie here (see
          # docker/kamailio/Dockerfile).
          - {
              name: kamailio,
              context: docker/kamailio,
              file: docker/kamailio/Dockerfile,
              target: "",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BuildKit runs in its own container and does not inherit the host
      # trust store, so both Nexus ports need the exemption: :443 is the
      # read-only group, :5000 the hosted repository that accepts the push.
      # Base images come through the pull-through cache, not Docker Hub.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            [registry."docker.io"]
              mirrors = ["192.168.10.131"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/azrtydxb/${{ matrix.image.name }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/azrtydxb/${{ matrix.image.name }}:main
