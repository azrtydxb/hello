# The shape mirrors kuvryn-scout: test jobs run in containers on the generic
# ARC runners, and what lands on main is built and pushed to Nexus by the
# publish runners. Kuvryn Sync then deploys those images (deploy/kuvryn-sync/).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Three tiers: the unit job goes on every pull request and push; the
  # integration tier — the database-backed suites, the race detector and the
  # HA soak — runs on the nightly cron, a manual dispatch, v* tags and any
  # pull request that changes database-touching paths (db-changes); the
  # full tier (kind-upgrade, lab) stays off the pull request path. Publish
  # stays on push to main and v* tags; bench stays dispatch-only.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # GitHub OIDC for the Kuvryn Ant docker login (azrtydxb/ant-setup-action).
  id-token: write

# A newer push to a pull request supersedes the run in progress; on main
# every commit runs to the end, because publish builds the image of that
# commit and kind-upgrade seeds the build cache from it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Authoritative Kuvryn Ant (OKE); kw replicates oci-hosted and its nodes serve
  # the old 192.168.10.131/azrtydxb/<image> names from that replica.
  REGISTRY: ant.azrty.com/oci-hosted

jobs:
  go:
    # Unit tier: hermetic tests only, on the PR and push-to-main path. The
    # database-backed suites run in the `integration` job (nightly, v* tags and
    # database-touching pull requests), so this job needs no service containers and stays inside the
    # five-minute PR budget. Tests that need a database, Valkey or MinIO skip
    # when their HELLO_TEST_* variable is unset; `integration` sets them and
    # runs the same `go test ./...`.
    if: github.event_name != 'workflow_dispatch'
    runs-on: arc-azrtydxb
    timeout-minutes: 20
    container:
      # The Go toolchain comes from the same base the Dockerfile builds
      # with, so CI and the image agree on the compiler.
      image: golang:1.27-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      # Go refuses to stamp VCS info for a workspace owned by another uid.
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The job container is not set up by setup-go, so the module and build
      # caches are restored by hand. Paths are the golang image's: GOPATH is
      # /go and the build cache lives under root's home. The key ends in the
      # commit so main saves a fresh build cache on every push; a pull request
      # restores the newest one for its go.sum (or any, after a dependency
      # bump) and never saves, so it cannot overwrite what main relies on.
      # Go checks every cache entry against its inputs, so a stale entry costs
      # a recompile, never a wrong build.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.arch }}-golang1.27-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.arch }}-golang1.27-${{ hashFiles('go.sum') }}-
            go-${{ runner.arch }}-golang1.27-
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # Unit tier: hermetic tests only. The database-backed suites and the
      # race detector run in `integration`, off the PR and push-to-main path.
      - run: go test -timeout 10m ./...
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.arch }}-golang1.27-${{ hashFiles('go.sum') }}-${{ github.sha }}

  db-changes:
    # Whether a pull request touches code the database-backed tests cover:
    # migrations, the store and API, the integration suite, and every package
    # with a HELLO_TEST_DATABASE_URL test. Only pull requests are filtered;
    # the other events run the integration job unconditionally.
    if: github.event_name == 'pull_request'
    runs-on: arc-azrtydxb
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            db:
              - 'migrations/**'
              - 'internal/store/**'
              - 'internal/api/**'
              - 'internal/ai/**'
              - 'internal/cdr/**'
              - 'internal/events/**'
              - 'internal/snapshot/**'
              - 'test/integration/**'
              - 'go.mod'
              - '.github/workflows/ci.yaml'

  integration:
    # Integration tier: the database-backed suites (PostgreSQL, Valkey, MinIO)
    # plus the race detector and the HA soak. Runs on the nightly cron, a
    # manual dispatch, v* tags (the full tier) and any pull request that
    # changes database-touching paths (see db-changes). The unit job skips
    # these tests, so this job is what actually proves the database code works.
    needs: db-changes
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'pull_request' && needs.db-changes.outputs.db == 'true'))
    runs-on: arc-azrtydxb
    timeout-minutes: 40
    container:
      image: golang:1.27-bookworm
    env:
      # The database-backed tests also read HELLO_TEST_DATABASE_URL,
      # HELLO_TEST_VALKEY_ADDR and HELLO_TEST_MINIO_ENDPOINT, set by the
      # "Wait for the services" step (without them they skip).
      HELLO_TEST_MINIO_PASS: hello-voicemail-secret
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hello
          POSTGRES_PASSWORD: hello
          POSTGRES_DB: hello
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
      minio:
        # The upstream image's default command only prints its help and a
        # service container cannot pass `server /data` arguments; bitnami's
        # starts its server from the root-user environment. The free
        # bitnami images were frozen into bitnamilegacy, which is fine for
        # a test-only object store.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: hello
          MINIO_ROOT_PASSWORD: hello-voicemail-secret
          # Headroom, not a feature: by default MinIO derives its
          # concurrent-request ceiling from the pod's memory and answers 503
          # SlowDown ("reduce your request rate") once requests queue past a
          # 10 s deadline, which a busy shared runner node reaches during the
          # firmware and recording tests. A generous ceiling and deadline
          # make it queue instead, and the scanner and console stay quiet.
          MINIO_API_REQUESTS_MAX: "1024"
          MINIO_API_REQUESTS_DEADLINE: 120s
          MINIO_SCANNER_SPEED: slowest
          MINIO_BROWSER: "off"
          MINIO_PROMETHEUS_AUTH_TYPE: public
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - name: Install the PostgreSQL client
        # TestRestoreIntegration runs the real pg_dump and pg_restore, which
        # must be at least the server's major version (18). Without them the
        # test skips, so a failure here only warns.
        continue-on-error: true
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates gnupg lsb-release
          install -d /usr/share/postgresql-common/pgdg
          curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.arch }}-golang1.27-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.arch }}-golang1.27-${{ hashFiles('go.sum') }}-
            go-${{ runner.arch }}-golang1.27-
      # On the ARC kubernetes-mode runners the job container and its services
      # share one pod: services answer on localhost (their names do not
      # resolve) and the services' --health-cmd options are ignored, so the
      # job no longer waits for them. Resolve the address that works (the
      # service name on Docker-mode runners, localhost on kubernetes-mode
      # ones) and wait for each service before the tests start.
      - name: Wait for the services
        shell: bash
        run: |
          svc() { if getent hosts "$1" >/dev/null; then echo "$1"; else echo localhost; fi; }
          wait_tcp() {
            for _ in $(seq 1 90); do
              if (exec 3<>"/dev/tcp/$1/$2") 2>/dev/null; then return 0; fi
              sleep 2
            done
            echo "::error::$1:$2 did not come up"; return 1
          }
          pg=$(svc postgres); vk=$(svc valkey)
          wait_tcp "$pg" 5432
          wait_tcp "$vk" 6379
          mn=$(svc minio)
          wait_tcp "$mn" 9000
          for _ in $(seq 1 60); do
            curl -fsS "http://$mn:9000/minio/health/live" >/dev/null && break
            sleep 2
          done
          curl -fsS "http://$mn:9000/minio/health/live" >/dev/null
          {
            echo "HELLO_TEST_MINIO_ENDPOINT=$mn:9000"
            echo "HELLO_TEST_DATABASE_URL=postgres://hello:hello@$pg:5432/hello?sslmode=disable"
            echo "HELLO_TEST_VALKEY_ADDR=$vk:6379"
          } >> "$GITHUB_ENV"
      # Everything with the services up: the database-backed tests run here
      # (the unit job skips them), and the race detector is affordable once a
      # night rather than on every push.
      - run: go test -timeout 30m ./...
      - name: go test -race
        run: go test -race -timeout 30m ./...
      # A MinIO SlowDown cannot be diagnosed from the test output alone: keep
      # the drive and request metrics of the failed run in the log.
      - name: MinIO diagnostics
        if: failure()
        shell: bash
        run: |
          curl -fsS "http://$HELLO_TEST_MINIO_ENDPOINT/minio/v2/metrics/node" \
            | grep -E '^minio_node_(drive|io|process_(resident|cpu))' | head -60 || true
          curl -fsS "http://$HELLO_TEST_MINIO_ENDPOINT/minio/v2/metrics/cluster" \
            | grep -E '^minio_(s3_requests_(rejected|errors|waiting)|node_drive_(offline|free))' | head -40 || true
      # The in-call HA races (a WaitGroup grown during shutdown, a transfer
      # writing the caller dialog under the original call) surfaced only
      # intermittently in one pass: soak the takeover matrix a few times.
      - name: In-call HA race soak
        run: go test -race -count=3 -run 'TestTakeoverScenarioMatrix|TestBackgroundWorkDuringShutdown|TestTakeoverKeepsClaimUntilRecorded' ./internal/sip/

  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    container:
      image: node:26-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      # node:26 no longer bundles corepack, so pnpm comes from npm.
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  bench:
    # TestDetectorLatency (spec ai-agent S-19): every AIOps detector under
    # 2 s over 1 000 000 CDRs and 10 000 devices. It needs PostgreSQL and
    # Valkey and seeds for minutes, so it runs only when dispatched:
    # gh workflow run ci.yaml --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-azrtydxb
    timeout-minutes: 45
    container:
      image: golang:1.27-bookworm
    env:
      HELLO_BENCH: "1"
      # HELLO_TEST_DATABASE_URL and HELLO_TEST_VALKEY_ADDR are set by the
      # "Wait for the services" step.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hello
          POSTGRES_PASSWORD: hello
          POSTGRES_DB: hello
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # On the ARC kubernetes-mode runners the job container and its services
      # share one pod: services answer on localhost (their names do not
      # resolve) and the services' --health-cmd options are ignored, so the
      # job no longer waits for them. Resolve the address that works (the
      # service name on Docker-mode runners, localhost on kubernetes-mode
      # ones) and wait for each service before the tests start.
      - name: Wait for the services
        shell: bash
        run: |
          svc() { if getent hosts "$1" >/dev/null; then echo "$1"; else echo localhost; fi; }
          wait_tcp() {
            for _ in $(seq 1 90); do
              if (exec 3<>"/dev/tcp/$1/$2") 2>/dev/null; then return 0; fi
              sleep 2
            done
            echo "::error::$1:$2 did not come up"; return 1
          }
          pg=$(svc postgres); vk=$(svc valkey)
          wait_tcp "$pg" 5432
          wait_tcp "$vk" 6379
          echo "HELLO_TEST_DATABASE_URL=postgres://hello:hello@$pg:5432/hello?sslmode=disable" >> "$GITHUB_ENV"
          echo "HELLO_TEST_VALKEY_ADDR=$vk:6379" >> "$GITHUB_ENV"
      - name: Detector latency over 1 000 000 CDRs
        run: go test -count=1 -timeout 40m -v -run TestDetectorLatency ./internal/ai/detect/

  lab:
    # The Phase 3 failure-injection and lab flow tests drive the real compose
    # lab (deploy/docker-compose), so they need the runner's Docker daemon,
    # the compose plugin and a Go toolchain on the runner itself — not a job
    # container. The go job must be green first: the lab builds the same
    # images from the same source.
    # Integration tier: the compose lab is far too slow for the PR path, so it
    # runs only on the nightly schedule and on manual dispatch.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [go]
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      # Evidence first: what the runner actually has decides whether this
      # job can work here at all.
      - name: Docker and compose on the runner
        run: |
          docker version
          docker compose version || {
            echo "compose plugin missing; installing"
            arch=$(uname -m); case $arch in
              x86_64) carch=x86_64 ;;
              aarch64|arm64) carch=aarch64 ;;
              *) echo "unsupported arch $arch"; exit 1 ;;
            esac
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.40.2/docker-compose-linux-$carch" \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lab and failure-injection tests
        env:
          HELLO_DOCKER: "1"
          # The phones run on the runner and reach the nodes through the
          # published ports, so the containers see the edge network's
          # gateway (pinned in compose) as the packet source, not
          # 127.0.0.1. Advertising that gateway as the Contact host keeps
          # the lab phones off the Phase 5 NAT anchor: they present
          # honest, matched addressing, and the direct-media pass-through
          # assertions stay about SIP signalling, not about Docker NAT.
          HELLO_LAB_CONTACT_HOST: 10.89.53.1
        run: go test -count=1 -timeout 50m -v ./test/integration/

  chart:
    # The Helm chart (deploy/helm/hello) rendered and checked: lint, the
    # kubeconform schema check, and the test/deploy invariants. helm and
    # kubeconform are tools here, not services: nothing is installed into a
    # cluster (kind-upgrade does that).
    runs-on: arc-azrtydxb
    timeout-minutes: 20
    container:
      image: golang:1.27-bookworm
    env:
      HELM_VERSION: v4.1.1
      KUBECONFORM_VERSION: v0.8.0
      # A missing helm must fail test/deploy here, not skip.
      HELLO_REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install helm and kubeconform
        run: |
          arch=$(uname -m); case $arch in
            x86_64) a=amd64 ;;
            aarch64|arm64) a=arm64 ;;
            *) echo "unsupported arch $arch"; exit 1 ;;
          esac
          cd "$(mktemp -d)"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${a}.tar.gz" -o helm.tgz
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${a}.tar.gz.sha256sum" -o helm.sha
          echo "$(cut -d' ' -f1 helm.sha)  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz "linux-${a}/helm"
          install "linux-${a}/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${a}.tar.gz" -o kc.tgz
          tar -xzf kc.tgz kubeconform
          install kubeconform /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/hello -f deploy/helm/hello/values-eval.yaml
          helm lint --strict deploy/helm/hello -f deploy/helm/hello/values-ha.yaml
      - name: Chart invariants and kubeconform
        run: go test -count=1 -v -run 'TestChart|TestKubernetesGuide' ./test/deploy/

  kind-upgrade:
    # Rolling upgrade with an active call (docs/kubernetes.md, "Upgrades"):
    # builds the images from this commit, creates a kind cluster, installs
    # the chart, registers two phones through Kamailio and connects a call,
    # then `helm upgrade`s Hello's pods and Kamailio and requires the call to
    # survive and hang up cleanly. Needs the runner's Docker daemon (as the
    # lab job does), kind, kubectl and helm on the runner itself.
    # Full/integration tier: never on a pull request. Kept on push to main
    # (not just the nightly cron and v* tags) because it seeds the shared
    # build cache that publish and the nightly runs read.
    if: github.event_name != 'pull_request'
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    env:
      KIND_VERSION: v0.30.0
      KUBECTL_VERSION: v1.34.0
      HELM_VERSION: v4.1.1
      HELLO_KIND_PASSWORD: kind-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tools on the runner
        run: |
          docker version
          arch=$(uname -m); case $arch in
            x86_64) a=amd64 ;;
            aarch64|arm64) a=arm64 ;;
            *) echo "unsupported arch $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/bin"
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${a}" -o "$HOME/bin/kind"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${a}/kubectl" -o "$HOME/bin/kubectl"
          chmod +x "$HOME/bin/kind" "$HOME/bin/kubectl"
          d=$(mktemp -d)
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${a}.tar.gz" -o "$d/helm.tgz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${a}.tar.gz.sha256sum" -o "$d/helm.sha"
          echo "$(cut -d' ' -f1 "$d/helm.sha")  $d/helm.tgz" | sha256sum -c -
          tar -xzf "$d/helm.tgz" -C "$d" "linux-${a}/helm"
          install "$d/linux-${a}/helm" "$HOME/bin/helm"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # The images build with BuildKit against a registry cache on the
      # in-cluster Nexus rather than a plain docker build, which started cold
      # on every ephemeral runner. Same buildkitd config as publish: BuildKit
      # runs in its own container and does not inherit the host trust store,
      # so both Nexus ports need the exemption (:443 the read-only group,
      # :5000 the hosted repository that accepts the cache write), and base
      # images come through the pull-through cache, not Docker Hub.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            [registry."docker.io"]
              mirrors = ["ant.azrty.com"]
      # Only a push to main writes the cache, so an untrusted pull request can
      # never poison the layers main builds from.
      # Kuvryn Ant buildcache feed (GitHub OIDC): cache-write is off outside push events.
      - id: ant-cache-1
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: control
          cache-write: ${{ github.event_name == 'push' }}
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      # load: true puts each image in the runner's Docker daemon, where
      # `kind load` picks it up as it did after docker build.
      - name: Build hello-control
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: hello-control
          load: true
          tags: hello.local/hello-control:ci
          cache-from: ${{ steps.ant-cache-1.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-1.outputs.cache-to }}
      - id: ant-cache-2
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: sip
          cache-write: ${{ github.event_name == 'push' }}
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Build hello-sip
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: hello-sip
          load: true
          tags: hello.local/hello-sip:ci
          cache-from: ${{ steps.ant-cache-2.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-2.outputs.cache-to }}
      - id: ant-cache-3
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: ui
          cache-write: ${{ github.event_name == 'push' }}
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Build hello-ui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          load: true
          tags: hello.local/hello-ui:ci
          cache-from: ${{ steps.ant-cache-3.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-3.outputs.cache-to }}
      - id: ant-cache-4
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: kamailio
          cache-write: ${{ github.event_name == 'push' }}
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Build kamailio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/kamailio
          load: true
          tags: hello.local/kamailio:ci
          cache-from: ${{ steps.ant-cache-4.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-4.outputs.cache-to }}
      - name: Tag the upgrade images
        run: |
          # The upgrade changes the image tag: the same bits under a new name.
          for i in hello-control hello-sip hello-ui kamailio; do
            docker tag hello.local/$i:ci hello.local/$i:ci-upgrade
          done
      - name: Create the kind cluster
        run: |
          cat > kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
              kubeadmConfigPatches:
                - |
                  kind: JoinConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "hello-edge=true"
              extraPortMappings:
                - { containerPort: 30508, hostPort: 30508, protocol: UDP }
                - { containerPort: 30508, hostPort: 30508, protocol: TCP }
                - { containerPort: 30081, hostPort: 30081, protocol: TCP }
            - role: worker
          EOF
          # Evidence first: what the runner's Docker daemon is.
          docker info --format 'server={{.ServerVersion}} cgroup={{.CgroupVersion}}/{{.CgroupDriver}} rootless={{.SecurityOptions}} cpus={{.NCPU}} mem={{.MemTotal}}'
          nproc; free -m || true; cat /proc/self/cgroup | head -5
          # kind's kubelets need more inotify instances than the default 128
          # ("too many open files" from kubelet start otherwise). The limits
          # are kernel-wide, so they are raised from a privileged container
          # on the runner's Docker daemon; harmless if already high.
          docker run --rm --privileged alpine:3.22 sh -c 'sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches; sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576' || echo "could not raise the inotify limits"
          kind create cluster --name hello --config kind.yaml --wait 5m --retain || {
            docker ps -a
            for n in hello-control-plane hello-worker hello-worker2; do
              echo "=== $n"; docker logs "$n" 2>&1 | tail -40
            done
            kind export logs --name hello ./kind-logs || true
            tail -n 60 ./kind-logs/*/journal.log 2>/dev/null || true
            exit 1
          }
          for i in hello-control hello-sip hello-ui kamailio; do
            kind load docker-image --name hello hello.local/$i:ci hello.local/$i:ci-upgrade
          done
          kubectl get nodes -o wide
      - name: Install the chart
        run: |
          # Phones reach Kamailio on the edge node's own address. Going
          # through the Docker published port (127.0.0.1) puts docker-proxy
          # between them, which rewrites the source port: Kamailio then takes
          # the phone for NAT'd and aliases its Contact to a proxy port that
          # expires after a minute, so later in-dialog requests (the handoff's
          # re-INVITE) never reach the phone.
          edge=$(docker inspect -f '{{(index .NetworkSettings.Networks "kind").IPAddress}}' hello-worker)
          echo "edge node address: $edge"
          echo "KIND_EDGE_IP=$edge" >> "$GITHUB_ENV"
          kubectl create namespace hello
          kubectl -n hello create secret generic hello-credentials \
            --from-literal=dsn='postgres://hello:kind-pg-pass@hello-postgresql:5432/hello?sslmode=disable' \
            --from-literal=secretKey="$(openssl rand -base64 32)" \
            --from-literal=nonceSecret="$(openssl rand -base64 48)" \
            --from-literal=bootstrapPassword="$HELLO_KIND_PASSWORD" \
            --from-literal=minioAccessKey=hello \
            --from-literal=minioSecretKey=kind-minio-pass \
            --from-literal=postgresUser=hello \
            --from-literal=postgresPassword=kind-pg-pass
          helm install hello deploy/helm/hello -n hello \
            -f deploy/helm/hello/values-eval.yaml \
            --set global.imageRegistry=hello.local \
            --set global.imageTag=ci \
            --set global.sipDomain=hello.kind \
            --set sip.hostNetwork=false \
            --set sip.mediaAnchorHost=podIP \
            --set sip.trustedProxies=10.0.0.0/8 \
            --set kamailio.hostNetwork=false \
            --set kamailio.service.type=NodePort \
            --set kamailio.service.nodePort=30508 \
            --set kamailio.publicHost="$edge" \
            --set kamailio.publicPort=30508 \
            --set kamailio.phonesPort=5060 \
            --set-string kamailio.nodeSelector.hello-edge=true \
            --set control.service.type=NodePort \
            --set control.service.nodePort=30081 \
            --wait --timeout 10m
          kubectl -n hello get pods -o wide
      - name: Follow the pod logs across the rollout
        run: |
          # Pods are replaced during the upgrade, taking their logs with
          # them: keep following each name for the failure report.
          mkdir -p "$RUNNER_TEMP/podlogs"
          for n in pod/hello-sip-0 pod/hello-sip-1 deploy/hello-kamailio; do
            f="$RUNNER_TEMP/podlogs/$(basename "$n").log"
            setsid nohup bash -c "while true; do kubectl -n hello logs -f --tail=-1 $n >> '$f' 2>&1; sleep 1; done" >/dev/null 2>&1 &
          done
          # Kamailio at debug level while the handoffs run: the failure report
          # greps it for the calls that were taken over.
          kubectl -n hello exec deploy/hello-kamailio -- kamcmd cfg.set_now_int core debug 3 || true
      - name: Rolling upgrade with an active call
        env:
          HELLO_KIND: "1"
        run: |
          gw=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "docker network gateway: $gw"
          export HELLO_KIND_CONTACT_HOST="$gw"
          export HELLO_KIND_API="http://$KIND_EDGE_IP:30081"
          export HELLO_KIND_SIP="$KIND_EDGE_IP:30508"
          export HELLO_KIND_ADMIN_PASSWORD="$HELLO_KIND_PASSWORD"
          export HELLO_KIND_CHART="$PWD/deploy/helm/hello"
          export HELLO_KIND_TAG=ci
          export HELLO_KIND_UPGRADE_TAG=ci-upgrade
          go test -count=1 -timeout 45m -v ./test/kindupgrade/
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n hello get pods -o wide || true
          kubectl -n hello describe pods || true
          for p in $(kubectl -n hello get pods -o name); do
            echo "=== $p"; kubectl -n hello logs --all-containers --tail=200 "$p" || true
          done
          for f in "$RUNNER_TEMP"/podlogs/*.log; do
            echo "=== followed log $f"; grep -v 'wait-dispatcher' "$f" | grep -v ' DEBUG:' | tail -n 150
          done
          grep -h 'takeover re-INVITE' "$RUNNER_TEMP"/podlogs/hello-sip-*.log | sed -n 's/.*"call_id":"\([^"]*\)".*/\1/p' | sort -u | while read -r id; do
            echo "=== kamailio lines for call $id"; grep -h "$id" "$RUNNER_TEMP/podlogs/hello-kamailio.log" | grep -E 'received sip message|t_relay|selected|set send socket|uri_add_rcv|WARN|ERROR|send|resolve' | cut -c1-260 | head -150
          done
          grep -hE 'WARNING|refused|rerouted|ERROR' "$RUNNER_TEMP/podlogs/hello-kamailio.log" | grep -v 'could not resolve\|failed to resolve\|no socket found\|unable to ping' | tail -n 60
          kubectl -n hello exec deploy/hello-kamailio -- kamcmd dispatcher.list || true
      - name: Remove the cluster
        if: always()
        run: kind delete cluster --name hello || true

  publish:
    # Only what lands on main becomes an image; a pull request is tested and
    # nothing more.
    if: github.event_name == 'push'
    needs: [go, web]
    runs-on: arc-azrtydxb
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image:
          - {
              name: hello-control,
              context: .,
              file: Dockerfile,
              target: hello-control,
              cache: control,
            }
          - {
              name: hello-sip,
              context: .,
              file: Dockerfile,
              target: hello-sip,
              cache: sip,
            }
          - {
              name: hello-ui,
              context: web,
              file: web/Dockerfile,
              target: "",
              cache: ui,
            }
          # The official kamailio image is amd64-only; the kw nodes are
          # arm64, so the edge image builds from Debian trixie here (see
          # docker/kamailio/Dockerfile).
          - {
              name: kamailio,
              context: docker/kamailio,
              file: docker/kamailio/Dockerfile,
              target: "",
              cache: kamailio,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner pod's BuildKit sidecar (linux/arm64, the kw nodes' arch),
      # not a builder container on the runner's Docker daemon. Its config
      # pulls base images through Kuvryn Ant's Docker Hub mirror. BuildKit
      # pushes with the credentials of the docker login below.
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      # Reads the build cache kind-upgrade writes on main (same cache names,
      # same arch); publish itself never writes it.
      - id: ant
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: ${{ matrix.image.cache }}
          arch-suffix: arm64
          cache-write: "false"
          sccache: "false"
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      # kamailio also gets a content-addressed tag, kc-<git tree hash of
      # docker/kamailio>. The image is built from that directory alone (the
      # config is the hello-kamailio ConfigMap, not baked in), so the tag is
      # the same on every commit that leaves it untouched, and pinning it in
      # deploy/kuvryn-sync keeps Sync from restarting the edge pod on
      # releases that do not change it. A tag is never overwritten: when it
      # is already in the registry the image is not pushed again (an
      # unpinned apt install would otherwise change what the tag means).
      - name: Content tag
        id: content
        env:
          NAME: ${{ matrix.image.name }}
        run: |
          tags="${REGISTRY}/azrtydxb/${NAME}:sha-${GITHUB_SHA}"
          if [ "$NAME" = kamailio ]; then
            kc="kc-$(git rev-parse HEAD:docker/kamailio | cut -c1-16)"
            if docker buildx imagetools inspect "${REGISTRY}/azrtydxb/${NAME}:${kc}" >/dev/null 2>&1; then
              echo "${kc} already published; not retagging"
            else
              tags="${tags}"$'\n'"${REGISTRY}/azrtydxb/${NAME}:${kc}"
              echo "publishing ${kc}"
            fi
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          # Stamps internal/version.Commit (GET /api/v1/version) in the Go
          # images; the other Dockerfiles declare no COMMIT arg.
          build-args: |
            COMMIT=${{ github.sha }}
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.content.outputs.tags }}
          cache-from: ${{ steps.ant.outputs.cache-from }}
