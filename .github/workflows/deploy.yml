# Publish the kw images. Triggered by a push to main and nothing else: a
# deploy names an image by its immutable sha- tag, so every commit on main
# must have one, and nothing off main may look like one.
#
# The Nexus fronts two ports: :5000 is the hosted repository, the only one
# that accepts a push; deployments pull the same image from :443 with no port
# suffix. Same convention as dhole and kuvryn-scout.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push does not supersede an older run: cancelling a build would
# leave a commit with no image for a deploy to name.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: 192.168.10.131:5000
  PULL_REGISTRY: 192.168.10.131

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: hello-control
            context: .
            file: Dockerfile
            target: hello-control
          - name: hello-sip
            context: .
            file: Dockerfile
            target: hello-sip
          - name: hello-ui
            context: web
            file: web/Dockerfile
            target: ""
    # Drives the runner's Docker daemon, so no `container:` — same as the
    # org's other image workflows.
    runs-on: [self-hosted, linux, x64] # kw Arc runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every build gets an immutable sha- tag, which is what a deploy names:
      # resources.yaml must never float on main.
      - name: Compute tags
        id: meta
        run: |
          {
            echo "short=sha-${GITHUB_SHA::7}"
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            [ "${GITHUB_REF}" = "refs/heads/main" ] && echo "${IMAGE}:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/azrtydxb/${{ matrix.image.name }}

      # BuildKit runs in its own container and does not inherit the host
      # trust store, so both Nexus ports need the exemption: :443 is the
      # read-only group, :5000 the hosted repository that accepts the push.
      # Base images come through the pull-through cache, not Docker Hub.
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: linux/amd64
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            [registry."docker.io"]
              mirrors = ["192.168.10.131"]

      - name: Log in to Nexus
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.short }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/${{ matrix.image.name }}:amd64
          # ignore-error: a cache write must never fail a publish.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/${{ matrix.image.name }}:amd64,mode=max,image-manifest=true,ignore-error=true

      # The image is only useful if a kw node can pull it under the name
      # resources.yaml uses (:443, no port suffix). Proving that here turns a
      # deploy-time ImagePullBackOff into a build-time failure.
      - name: The pull name resolves
        run: |
          name="${PULL_REGISTRY}/azrtydxb/${{ matrix.image.name }}:${{ steps.meta.outputs.short }}"
          for _ in $(seq 1 30); do
            if docker manifest inspect --insecure "$name" >/dev/null 2>&1; then
              echo "$name is pullable"
              exit 0
            fi
            sleep 4
          done
          echo "pushed to ${REGISTRY} but $name does not resolve" >&2
          exit 1
