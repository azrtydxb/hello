# momo (github.com/azrtydxb/momo) settings for Hello's database layer: the
# models, the migrations and the engine hello-control runs.
#
# The models in internal/db/models declare the whole schema. A schema change
# edits a model and generates a migration from it (docs/database.md,
# "Changing the schema"), from the repository root, without a database:
#
#   MOMO=github.com/azrtydxb/momo/cmd/momo@$(go list -m -f '{{.Version}}' github.com/azrtydxb/momo)
#   go run "$MOMO" generate
#   go run "$MOMO" migrate diff <name>
#   go run "$MOMO" migrate validate
#
# hello-control reads this file too (it is embedded, see momo.go at the
# repository root), so the engine it runs and the CLI agree.
version: 1
packages:
  - ./internal/db/models
dialects: [postgres]
migrate:
  dir:
    postgres: migrations/postgres
  # A DDL statement waits this long for its table lock, then the migration
  # rolls back and the init container's retry loop runs it again.
  lock_timeout: 30s
  exclude:
    # goose's history, left in place after the takeover from the frozen goose
    # set (migrations/legacy), with its id sequence.
    - goose_db_version
    - goose_db_version_*
introspect:
  package: models
  out: internal/db/models
  skip:
    - goose_db_version
  uuid: google
  # Every NOT NULL column with a default gets the dbdefault tag, so a model
  # insert leaves it to PostgreSQL; a non-zero constant default is a pointer
  # (nil keeps the default, non-nil is always written).
  dbdefault: all
  types:
    inet: { go: string }
    cidr: { go: string }
    "inet[]": { go: "[]string" }
    "cidr[]": { go: "[]string" }
